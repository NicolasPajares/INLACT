                pointer;

                transform .15s ease,
                box-shadow .15s ease;

        }


        .actividad-historial:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 4px 14px
                rgba(31,78,140,.10);

        }


        .actividad-fecha {

            font-size:
                13px;

        /* =====================================================
           MENSAJE

        .mensaje-historial {

                center;

        /* =====================================================
           VENTANA EMERGENTE
        ====================================================== */

        .overlay-historial {

            position:
                fixed;

            inset:
                0;

                flex;

            align-items:

                99999;

                border-box;

        }


        .ventana-historial {

            background:
                white;

                92%;

            max-width:
                600px;

            max-height:
                85vh;

            overflow-y:
                auto;

            border-radius:
                16px;

            padding:
                25px;

            box-sizing:
                border-box;

        }


        .cerrar-historial {

            width:
                100%;

            margin-top:
                20px;

            padding:
                13px;

            border:
                0;

            border-radius:
                8px;

            background:
                #1f4e8c;

            color:
                white;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

        }


    </style>

<!-- =========================================================
     FIREBASE
========================================================== -->

<script type="module">


    import {

        collection,

        query,

        where,

        getDocs,

        doc,

        getDoc

    }

    from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


    import {

        db

    }

    from
        "./firebase.js";



    /* ========================================================
       ID DEL CLIENTE
    ========================================================= */

    const clienteId =

        new URLSearchParams(
            window.location.search
        ).get("id");



    /* ========================================================
       ELEMENTOS
    ========================================================= */

    const lista =

        document.getElementById(
            "listaHistorialCompleto"
        );


    const nombreClienteEl =

        document.getElementById(
            "clienteNombreHistorial"
        );


    const volverBtn =

        document.getElementById(
            "volverClienteBtn"
        );



    /* ========================================================
       ESCAPAR HTML
    ========================================================= */

    function escaparHTML(
        texto
    ) {

        return String(
            texto ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }



    /* ========================================================
       CONVERTIR FECHA
    ========================================================= */

    function convertirFecha(
        valor
    ) {

        if (

            valor &&

            typeof valor.toDate ===
            "function"

        ) {

            return valor.toDate();

        }


        if (valor) {

            const fecha =
                new Date(valor);


            if (
                !isNaN(
                    fecha.getTime()
                )
            ) {

                return fecha;

            }

        }


        return null;

    }



    /* ========================================================
       MOSTRAR FECHA
    ========================================================= */

    function mostrarFecha(
        fecha
    ) {

        if (!fecha) {

            return "Sin fecha";

        }


        return fecha.toLocaleString(

            "es-AR",

            {

                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }

        );

    }



    /* ========================================================
       ERROR
    ========================================================= */

    function mostrarError(
        mensaje
    ) {

        lista.innerHTML = `

            <div
                class="mensaje-historial"
            >

                ${escaparHTML(
                    mensaje
                )}

            </div>

        `;

    }



    /* ========================================================
       VENTANA EMERGENTE
    ========================================================= */

    function abrirOverlay(

        titulo,

        fechaTexto,

        contenidoHTML

    ) {


        const overlay =

            document.createElement(
                "div"
            );


        overlay.className =
            "overlay-historial";


        const ventana =

            document.createElement(
                "div"
            );


        ventana.className =
            "ventana-historial";


        ventana.innerHTML = `


            <h2
                style="
                    margin-top:0;
                    color:#1f4e8c;
                "
            >

                ${escaparHTML(
                    titulo
                )}

            </h2>



            <div
                style="
                    font-size:13px;
                    color:#777;
                    margin-bottom:18px;
                "
            >

                ${escaparHTML(
                    fechaTexto
                )}

            </div>



            <div>

                ${contenidoHTML}

            </div>



            <button
                type="button"
                class="cerrar-historial"
            >

                Cerrar

            </button>


        `;


        overlay.appendChild(
            ventana
        );


        document.body.appendChild(
            overlay
        );


        ventana

            .querySelector(
                "button"
            )

            .onclick = () => {

                overlay.remove();

            };


        overlay.onclick =
            evento => {

                if (
                    evento.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            };

    }



    /* ========================================================
       RENDERIZAR ACTIVIDAD
    ========================================================= */

    function renderActividad(
        actividad
    ) {


        const tarjeta =

            document.createElement(
                "div"
            );


        tarjeta.className =
            "actividad-historial";


        const fechaTexto =

            mostrarFecha(
                actividad.fecha
            );



        /* ====================================================
           VENTA
        ==================================================== */

        if (
            actividad.origen ===
            "venta"
        ) {


            tarjeta.innerHTML = `


                <div
                    class="actividad-fecha"
                >

                    ${escaparHTML(
                        fechaTexto
                    )}

                </div>



                <div
                    class="actividad-badge"
                >

                    💰 Venta

                </div>



                <div
                    class="actividad-titulo"
                >

                    ${actividad.productos.length}

                    producto${
                        actividad.productos.length ===
                        1
                            ? ""
                            : "s"
                    }

                </div>


            `;



            tarjeta.addEventListener(
                "click",
                () => {


                    let productosHTML =
                        "";


                    actividad.productos
                        .forEach(
                            producto => {


                                productosHTML += `

                                    <div
                                        style="
                                            padding:12px 0;
                                            border-bottom:1px solid #ddd;
                                        "
                                    >


                                        <strong
                                            style="
                                                color:#1f4e8c;
                                                font-size:16px;
                                            "
                                        >

                                            ${escaparHTML(
                                                producto.nombre
                                            )}

                                        </strong>



                                        <div
                                            style="
                                                margin-top:5px;
                                                color:#555;
                                            "
                                        >

                                            Cantidad:

                                            ${
                                                producto.cantidad ??
                                                "-"
                                            }

                                            ${escaparHTML(
                                                producto.unidad
                                            )}

                                        </div>



                                        ${
                                            producto.lote

                                            ?

                                            `

                                                <div
                                                    style="
                                                        margin-top:3px;
                                                        color:#777;
                                                        font-size:13px;
                                                    "
                                                >

                                                    Lote:

                                                    ${escaparHTML(
                                                        producto.lote
                                                    )}

                                                </div>

                                            `

                                            :

                                            ""
                                        }


                                    </div>

                                `;

                            }
                        );


                    abrirOverlay(

                        "💰 Venta",

                        fechaTexto,

                        productosHTML

                    );


                }
            );


            return tarjeta;

        }



        /* ====================================================
           ENSAYO / COTIZACIÓN
        ==================================================== */

        if (

            actividad.origen ===
            "ensayo"

            ||

            actividad.origen ===
            "cotizacion"

        ) {


            const esEnsayo =

                actividad.origen ===
                "ensayo";


            const tipoTexto =

                esEnsayo

                    ? "🧪 Ensayo"

                    : "📄 Cotización";


            const titulo =

                esEnsayo

                    ?

                    (

                        actividad.datos
                            .nombreEnsayo

                        ||

                        "Ensayo"

                    )

                    :

                    (

                        actividad.datos
                            .nombreCotizacion

                        ||

                        "Cotización"

                    );



            tarjeta.innerHTML = `


                <div
                    class="actividad-fecha"
                >

                    ${escaparHTML(
                        fechaTexto
                    )}

                </div>



                <div
                    class="actividad-badge"
                >

                    ${tipoTexto}

                </div>



                <div
                    class="actividad-titulo"
                >

                    ${escaparHTML(
                        titulo
                    )}

                </div>


            `;



            tarjeta.addEventListener(
                "click",
                () => {


                    const pagina =

                        esEnsayo

                            ?

                            `ensayo.html?id=${actividad.id}`

                            :

                            `cotizacion.html?id=${actividad.id}`;


                    /*
                     * ABRIR EN UNA PESTAÑA NUEVA
                     */

                    window.open(
                        pagina,
                        "_blank"
                    );


                }
            );


            return tarjeta;

        }



        /* ====================================================
           VISITA / NOTA
        ==================================================== */

        const datos =
            actividad.datos;


        const titulo =

            datos.titulo

            ||

            (

                datos.tipoVisita ===
                "Nota"

                    ?

                    "Nota"

                    :

                    "Visita"

            );


        const tipoTexto =

            datos.tipoVisita ===
            "Nota"

                ?

                "📝 Nota"

                :

                "📍 Visita";



        tarjeta.innerHTML = `


            <div
                class="actividad-fecha"
            >

                ${escaparHTML(
                    fechaTexto
                )}

            </div>



            <div
                class="actividad-badge"
            >

                ${tipoTexto}

            </div>



            <div
                class="actividad-titulo"
            >

                ${escaparHTML(
                    titulo
                )}

            </div>


        `;



        tarjeta.addEventListener(
            "click",
            () => {


                const contenido =
                    datos.nota ||
                    "";


                abrirOverlay(

                    titulo,

                    fechaTexto,

                    `

                        <div
                            style="
                                white-space:pre-wrap;
                                line-height:1.5;
                                font-size:16px;
                                color:#333;
                            "
                        >

                            ${escaparHTML(
                                contenido ||
                                "Sin contenido."
                            )}

                        </div>

                    `

                );


            }
        );


        return tarjeta;

    }



    /* ========================================================
       CARGAR CLIENTE
    ========================================================= */

    async function cargarCliente() {


        if (!clienteId) {

            nombreClienteEl.textContent =
                "Cliente no identificado";

            return;

        }


        try {


            const referencia =

                doc(
                    db,
                    "clientes",
                    clienteId
                );


            const snap =

                await getDoc(
                    referencia
                );


            if (
                snap.exists()
            ) {


                const datos =
                    snap.data();


                nombreClienteEl.textContent =

                    datos.nombre ||

                    "Cliente";


            }

            else {


                nombreClienteEl.textContent =

                    "Cliente no encontrado";

            }


        }

        catch (error) {


            console.error(
                "Error cargando cliente:",
                error
            );


            nombreClienteEl.textContent =
                "Cliente";


        }

    }



    /* ========================================================
       CARGAR HISTORIAL COMPLETO
    ========================================================= */

    async function cargarHistorialCompleto() {


        if (!clienteId) {


            mostrarError(
                "No se encontró el identificador del cliente."
            );


            return;

        }


        lista.innerHTML = `

            <div
                class="mensaje-historial"
            >

                Cargando historial...

            </div>

        `;



        try {


            /* =================================================
               VISITAS Y NOTAS
            ================================================== */

            const consultaVisitas =

                query(

                    collection(
                        db,
                        "visitas"
                    ),

                    where(
                        "clienteId",
                        "==",
                        clienteId
                    )

                );


            const resultadoVisitas =

                await getDocs(
                    consultaVisitas
                );



            /* =================================================
               EGRESOS / VENTAS
            ================================================== */

            const consultaEgresos =

                query(

                    collection(
                        db,
                        "egresos"
                    ),

                    where(
                        "clienteId",
                        "==",
                        clienteId
                    )

                );


            const resultadoEgresos =

                await getDocs(
                    consultaEgresos
                );



            /* =================================================
               ENSAYOS
            ================================================== */

            const consultaEnsayos =

                query(

                    collection(
                        db,
                        "ensayos"
                    ),

                    where(
                        "clienteId",
                        "==",
                        clienteId
                    )

                );


            const resultadoEnsayos =

                await getDocs(
                    consultaEnsayos
                );



            /* =================================================
               COTIZACIONES
            ================================================== */

            const consultaCotizaciones =

                query(

                    collection(
                        db,
                        "cotizaciones"
                    ),

                    where(
                        "clienteId",
                        "==",
                        clienteId
                    )

                );


            const resultadoCotizaciones =

                await getDocs(
                    consultaCotizaciones
                );



            const actividades = [];



            /* =================================================
               VISITAS / NOTAS
            ================================================== */

            resultadoVisitas.forEach(
                documento => {


                    const datos =
                        documento.data();


                    if (

                        datos.tipoVisita !==
                            "Nota de visita"

                        &&

                        datos.tipoVisita !==
                            "Nota"

                    ) {

                        return;

                    }


                    const fecha =

                        convertirFecha(
                            datos.fecha
                        );


                    actividades.push({

                        id:
                            documento.id,

                        origen:
                            "visita",

                        datos:
                            datos,

                        fecha:
                            fecha

                    });


                }
            );



            /* =================================================
               VENTAS
            ================================================== */

            const ventasPorFecha =
                new Map();


            resultadoEgresos.forEach(
                documento => {


                    const datos =
                        documento.data();


                    /*
                     * SOLAMENTE VENTAS
                     */

                    if (

                        datos.tipoEgreso !==
                        "venta"

                    ) {

                        return;

                    }


                    let fecha =
                        null;



                    /*
                     * FECHA REAL
                     */

                    if (

                        datos.creadoEn

                        &&

                        typeof
                            datos.creadoEn.toDate ===
                            "function"

                    ) {

                        fecha =
                            datos.creadoEn.toDate();

                    }



                    /*
                     * RESPALDO
                     */

                    if (

                        !fecha

                        &&

                        datos.fecha

                    ) {


                        const fechaConvertida =

                            new Date(

                                `${datos.fecha}T00:00:00`

                            );


                        if (

                            !isNaN(

                                fechaConvertida
                                    .getTime()

                            )

                        ) {

                            fecha =
                                fechaConvertida;

                        }

                    }



                    let claveFecha =
                        "sin-fecha";


                    if (fecha) {


                        claveFecha =

                            fecha
                                .getFullYear()

                            +

                            "-"

                            +

                            String(

                                fecha
                                    .getMonth()
                                + 1

                            ).padStart(
                                2,
                                "0"
                            )

                            +

                            "-"

                            +

                            String(

                                fecha
                                    .getDate()

                            ).padStart(
                                2,
                                "0"
                            );

                    }



                    if (

                        !ventasPorFecha.has(
                            claveFecha
                        )

                    ) {


                        ventasPorFecha.set(

                            claveFecha,

                            {

                                id:
                                    "venta-" +
                                    claveFecha,

                                origen:
                                    "venta",

                                fecha:
                                    fecha,

                                productos:
                                    []

                            }

                        );

                    }



                    const venta =

                        ventasPorFecha.get(
                            claveFecha
                        );



                    venta.productos.push({

                        nombre:

                            datos.productoNombre ||

                            "Producto sin nombre",

                        cantidad:

                            datos.cantidad,

                        unidad:

                            datos.unidad ||

                            "",

                        lote:

                            datos.lote ||

                            ""

                    });



                    if (

                        fecha

                        &&

                        (

                            !venta.fecha

                            ||

                            fecha >
                            venta.fecha

                        )

                    ) {

                        venta.fecha =
                            fecha;

                    }


                }
            );



            ventasPorFecha.forEach(
                venta => {

                    actividades.push(
                        venta
                    );

                }
            );



            /* =================================================
               ENSAYOS
            ================================================== */

            resultadoEnsayos.forEach(
                documento => {


                    const datos =
                        documento.data();


                    let fecha =
                        null;



                    if (

                        datos.creadoEn

                        &&

                        typeof
                            datos.creadoEn.toDate ===
                            "function"

                    ) {

                        fecha =
                            datos.creadoEn.toDate();

                    }


                    else if (

                        datos.fecha

                        &&

                        typeof
                            datos.fecha.toDate ===
                            "function"

                    ) {

                        fecha =
                            datos.fecha.toDate();

                    }


                    else if (
                        datos.fecha
                    ) {


                        const fechaConvertida =

                            new Date(

                                `${datos.fecha}T00:00:00`

                            );


                        if (

                            !isNaN(

                                fechaConvertida
                                    .getTime()

                            )

                        ) {

                            fecha =
                                fechaConvertida;

                        }

                    }



                    actividades.push({

                        id:
                            documento.id,

                        origen:
                            "ensayo",

                        datos:
                            datos,

                        fecha:
                            fecha

                    });


                }
            );



            /* =================================================
               COTIZACIONES
            ================================================== */

            resultadoCotizaciones.forEach(
                documento => {


                    const datos =
                        documento.data();


                    let fecha =
                        null;



                    if (

                        datos.creadoEn

                        &&

                        typeof
                            datos.creadoEn.toDate ===
                            "function"

                    ) {

                        fecha =
                            datos.creadoEn.toDate();

                    }


                    else if (

                        datos.fecha

                        &&

                        typeof
                            datos.fecha.toDate ===
                            "function"

                    ) {

                        fecha =
                            datos.fecha.toDate();

                    }


                    else if (
                        datos.fecha
                    ) {


                        const fechaConvertida =

                            new Date(

                                `${datos.fecha}T00:00:00`

                            );


                        if (

                            !isNaN(

                                fechaConvertida
                                    .getTime()

                            )

                        ) {

                            fecha =
                                fechaConvertida;

                        }

                    }



                    actividades.push({

                        id:
                            documento.id,

                        origen:
                            "cotizacion",

                        datos:
                            datos,

                        fecha:
                            fecha

                    });


                }
            );



            /* =================================================
               ORDENAR
            ================================================== */

            actividades.sort(

                (a, b) =>

                    (

                        b.fecha?.getTime() ||
                        0

                    )

                    -

                    (

                        a.fecha?.getTime() ||
                        0

                    )

            );



            lista.innerHTML =
                "";



            if (
                !actividades.length
            ) {


                lista.innerHTML = `

                    <div
                        class="mensaje-historial"
                    >

                        No hay registros
                        en el historial.

                    </div>

                `;


                return;

            }



            /* =================================================
               MOSTRAR TODO
            ================================================== */

            actividades.forEach(
                actividad => {


                    lista.appendChild(

                        renderActividad(
                            actividad
                        )

                    );


                }
            );


        }

        catch (error) {


            console.error(

                "ERROR CARGANDO HISTORIAL COMPLETO:",

                error

            );


            mostrarError(

                "No se pudo cargar el historial."

            );


        }

    }



    /* ========================================================
       VOLVER AL CLIENTE
    ========================================================= */

    volverBtn.addEventListener(
        "click",
        () => {


            if (clienteId) {


                window.location.href =

                    `cliente.html?id=${clienteId}`;


            }

            else {


                window.location.href =
                    "clientes.html";


            }


        }
    );



    /* ========================================================
       INICIAR
    ========================================================= */

    await cargarCliente();

    await cargarHistorialCompleto();


</script>


</body>

</html>
