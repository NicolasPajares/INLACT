<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>INLACT · Cliente</title>
  <meta name="description" content="INLACT - Detalle de cliente">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="cliente.css">
</head>

<body>

<header>
  <figure>
    <img src="img/logo.jpg" alt="INLACT">
  </figure>
  <h2>NICOLÁS PAJARES</h2>
</header>

<main>

  <section class="quick-actions">

    <a href="clientes.html" class="action-card">
      <img src="img/icon-clientes.svg" alt="">
      <span>Clientes</span>
    </a>

    <a href="stock.html" class="action-card">
      <img src="img/icon-stock.svg" alt="">
      <span>Stock</span>
    </a>

    <a href="ensayos.html" class="action-card">
      <img src="img/icon-ensayos.svg" alt="">
      <span>Ensayos</span>
    </a>

    <a href="precios.html" class="action-card">
      <img src="img/icon-precios.svg" alt="">
      <span>Precios</span>
    </a>

  </section>


  <section class="card cliente-card">

    <div class="cliente-cabecera">

      <div class="cliente-nombre">
        <h2 id="clienteNombre">Cargando cliente...</h2>
      </div>


      <div id="clienteDatos" class="cliente-datos">

        <div class="bloque-datos-cliente">

          <div class="titulo-datos-cliente">

            <h2>Datos del cliente</h2>

            <div class="menu-contacto">

              <button
                id="menuContactoBtn"
                class="btn-menu-contacto"
                type="button"
                aria-label="Opciones del cliente">
                ⋮
              </button>

              <div
                id="menuContactoOpciones"
                class="menu-contacto-opciones"
                hidden>

                <button id="editarClienteMenuBtn" type="button">
                  ✏️ Editar
                </button>

                <button id="eliminarClienteMenuBtn" type="button">
                  🗑️ Eliminar
                </button>

              </div>

            </div>

          </div>


          <div class="campo">
            <label>Contacto</label>
            <span id="contactoTxt"></span>
            <input type="text" id="contactoInput" hidden>
          </div>


          <div class="campo">
            <label>Posición</label>
            <span id="posicionTxt"></span>
            <input type="text" id="posicionInput" hidden>
          </div>


          <div class="campo">
            <label>Teléfono</label>
            <span id="telefonoTxt"></span>
            <a id="wspLink" target="_blank"></a>
            <input type="text" id="telefonoInput" hidden>
          </div>


          <div class="campo">
            <label>Email</label>
            <span id="emailTxt"></span>
            <a id="mailLink" target="_blank"></a>
            <input type="email" id="emailInput" hidden>
          </div>


          <div class="campo">
            <label>Observaciones</label>
            <p id="observacionesTxt"></p>
            <textarea
              id="observacionesInput"
              rows="4"
              hidden></textarea>
          </div>


          <div class="acciones-form">

            <button
              id="guardarBtn"
              class="btn-secundario"
              hidden>
              💾 Guardar cambios
            </button>

          </div>

        </div>


        <div class="acciones-contactos">

          <button
            id="agregarContactoBtn"
            class="btn-principal"
            type="button">
            ➕ Agregar contacto
          </button>

        </div>

      </div>

    </div>

  </section>


  <section class="card historial-card">

    <h2>Historial de visitas</h2>

    <div
      id="listaVisitasCliente"
      class="lista-historial">
    </div>

    <button
      id="verHistorialCompleto"
      class="btn-outline"
      type="button">
      📋 Ver historial completo
    </button>

  </section>


  <section style="text-align:center; margin-top:20px;">

    <button
      class="btn-volver"
      onclick="window.location.href='clientes.html'">
      ⬅ Volver a clientes
    </button>

  </section>

</main>


<footer>
  <p>
    © INLACT ·
    <a href="aviso-legal.html">Aviso Legal</a>
  </p>
</footer>


<script
  type="module"
  src="cliente.js">
</script>

</body>
</html>
