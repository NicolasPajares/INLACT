<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>INLACT · Cliente</title>

  <!-- SEO / Mobile -->
  <meta name="description" content="INLACT - Detalle de cliente">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS base -->
  <link rel="stylesheet" href="index.css">

  <!-- CSS específico cliente -->
  <link rel="stylesheet" href="cliente.css">
</head>

<body>

<header>
  <figure>
    <img src="img/logo.jpg" alt="INLACT">
  </figure>
  <h2>NICOLÁS PAJARES</h2>
</header>

<main>

<!-- ===============================
     ACCESOS RÁPIDOS
================================ -->
<section class="quick-actions">
  <a href="clientes.html" class="action-card">
    <img src="img/icon-clientes.svg" alt="">
    <span>Clientes</span>
  </a>

  <a href="stock.html" class="action-card">
    <img src="img/icon-stock.svg" alt="">
    <span>Stock</span>
  </a>

  <a href="ensayos.html" class="action-card">
    <img src="img/icon-ensayos.svg" alt="">
    <span>Ensayos</span>
  </a>

  <a href="precios.html" class="action-card">
    <img src="img/icon-precios.svg" alt="">
    <span>Precios</span>
  </a>
</section>

<!-- ===============================
     DATOS DEL CLIENTE
================================ -->
<section class="card cliente-card">

  <h2 id="clienteNombre">Cargando cliente...</h2>

  <div id="clienteDatos" class="cliente-datos">

    <div class="campo">
      <label>Contacto</label>
      <span id="contactoTxt"></span>
      <input type="text" id="contactoInput" hidden>
    </div>

    <div class="campo">
      <label>Posición</label>
      <span id="posicionTxt"></span>
      <input type="text" id="posicionInput" hidden>
    </div>

    <div class="campo">
      <label>Teléfono</label>
      <span id="telefonoTxt"></span>
      <a id="wspLink" target="_blank"></a>
      <input type="text" id="telefonoInput" hidden>
    </div>

    <div class="campo">
      <label>Email</label>
      <span id="emailTxt"></span>
      <a id="mailLink" target="_blank"></a>
      <input type="email" id="emailInput" hidden>
    </div>

    <div class="campo">
      <label>Observaciones</label>
      <p id="observacionesTxt"></p>
      <textarea id="observacionesInput" rows="4" hidden></textarea>
    </div>

    <div class="acciones-form">
  <button id="agregarContactoBtn" class="btn-principal">
    ➕ Agregar contacto
  </button>

  <button id="guardarBtn" class="btn-secundario" hidden>
    💾 Guardar cambios
  </button>
</div>

<!-- ===============================
     NUEVO CONTACTO
================================ -->
<div id="nuevoContacto" class="form-contacto" hidden>

  <div class="contacto-form-grid">

    <div class="campo">
      <label>Contacto</label>
      <input type="text" id="nuevoContactoNombre">
    </div>

    <div class="campo">
      <label>Posición</label>
      <input type="text" id="nuevoContactoPosicion">
    </div>

    <div class="campo">
      <label>Teléfono</label>
      <input type="text" id="nuevoContactoTelefono">
    </div>

    <div class="campo">
      <label>Email</label>
      <input type="email" id="nuevoContactoEmail">
    </div>

    <div class="campo campo-observaciones">
      <label>Observaciones</label>
      <textarea id="nuevoContactoObservaciones" rows="4"></textarea>
    </div>

  </div>

  <div class="acciones-form">

    <button type="button" id="guardarNuevoContactoBtn" class="btn-principal">
      💾 Guardar contacto
    </button>

    <button type="button" id="cancelarNuevoContactoBtn" class="btn-secundario">
      Cancelar
    </button>

  </div>

</div>

  </div>
</section>

<!-- ===============================
     HISTORIAL
================================ -->
<section class="card historial-card">
  <h2>Historial de visitas</h2>

  <div id="listaVisitasCliente" class="lista-historial"></div>

  <button id="verHistorialCompleto" class="btn-outline">
    📋 Ver historial completo
  </button>
</section>

<!-- ===============================
     VOLVER
================================ -->
<section style="text-align:center; margin-top:20px;">
  <button class="btn-volver" onclick="window.location.href='clientes.html'">
    ⬅ Volver a clientes
  </button>
</section>

</main>

<footer>
  <p>© INLACT · <a href="aviso-legal.html">Aviso Legal</a></p>
</footer>

<!-- JS -->
<script type="module" src="cliente.js"></script>

</body>
</html>
