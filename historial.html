
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial completo · INLACT</title>
    <meta name="description" content="Historial completo de actividades de INLACT">
    <link rel="stylesheet" href="index.css">

    <style>
        .historial-container {
            max-width: 1100px;
            margin: 30px auto;
        }

        .historial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .historial-header h1 {
            margin: 0;
            color: #1f4e8c;
            font-size: 28px;
        }

        .historial-subtitulo {
            margin: 6px 0 0;
            color: #777;
        }

        .btn-volver-historial {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            background: #1f4e8c;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-volver-historial:hover {
            background: #173b6a;
        }

        .lista-historial {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .actividad-historial {
            background: white;
            border: 1px solid #e1e7ee;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .actividad-historial:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(31, 78, 140, .10);
        }

        .actividad-fecha {
            font-size: 13px;
            color: #777;
            margin-bottom: 7px;
        }

        .actividad-badge {
            display: inline-block;
            background: #f1f4f8;
            color: #1f4e8c;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .actividad-titulo {
            font-size: 17px;
            font-weight: 600;
            color: #1f4e8c;
        }

        .actividad-creador {
            margin-top: 7px;
            color: #667085;
            font-size: 13px;
        }

        .actividad-empresa {
            margin: 0 0 8px;
            color: #1f4e8c;
            font-size: 16px;
            font-weight: 700;
        }

        .mensaje-historial {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }

        .overlay-historial {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 20px;
            box-sizing: border-box;
        }

        .ventana-historial {
            background: white;
            width: 92%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 25px;
            box-sizing: border-box;
        }

        .producto-historial {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .producto-historial strong {
            color: #1f4e8c;
            font-size: 16px;
        }

        .producto-historial p {
            margin: 5px 0 0;
            color: #555;
        }

        .cerrar-historial {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #1f4e8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reporte-controles {
            display: flex;
            align-items: end;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0 0 20px;
            padding: 16px;
            background: #f5f8fc;
            border: 1px solid #e1e7ee;
            border-radius: 12px;
        }
        .reporte-campo { display: flex; flex-direction: column; gap: 6px; color: #1f4e8c; font-size: 13px; font-weight: 600; }
        .reporte-campo select, .reporte-campo input { min-height: 38px; padding: 7px 9px; border: 1px solid #ccd6e2; border-radius: 7px; background: white; color: #333; }
        .reporte-fechas { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-generar-reporte { border: 0; border-radius: 8px; padding: 11px 16px; background: #1f4e8c; color: white; font-weight: 600; cursor: pointer; min-height: 40px; }
        .btn-generar-reporte:hover { background: #173b6a; }
        @media print { body { visibility: visible !important; } }

        @media (max-width: 600px) {
            .historial-container {
                margin: 18px 12px;
            }

            .historial-header h1 {
                font-size: 23px;
            }

            .btn-volver-historial {
                width: 100%;
            }
        }
    </style>
</head>

<body style="visibility: hidden;">

    
<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>


    <main>
        <section class="card historial-container">
            <div class="historial-header">
                <div>
                    <h1>Historial completo</h1>
                    <p class="historial-subtitulo">
                        Actividad registrada en todas las empresas
                    </p>
                </div>

                <button id="volverInicioBtn"
                        class="btn-volver-historial"
                        type="button">
                    ← Volver al inicio
                </button>
            </div>

            <div class="reporte-controles">
                <div class="reporte-fechas">
                    <label class="reporte-campo" for="fechaDesde">Desde
                        <input type="date" id="fechaDesde">
                    </label>
                    <label class="reporte-campo" for="fechaHasta">Hasta
                        <input type="date" id="fechaHasta">
                    </label>
                </div>
                <button type="button" id="btnGenerarReporte" class="btn-generar-reporte">📄 Generar informe PDF</button>
            </div>

            <div id="listaHistorialCompleto" class="lista-historial">
                <div class="mensaje-historial">
                    Cargando historial...
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>
            © INLACT ·
            <a href="aviso-legal.html">Aviso Legal</a>
        </p>
    </footer>

    <script type="module">
        import { protegerPagina } from "./proteger.js";
        import { db, auth } from "./firebase.js";

        import {
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const lista = document.getElementById("listaHistorialCompleto");
        let actividadesCargadas = [];


        function escaparHTML(texto) {
            return String(texto ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function convertirFecha(valor) {
            if (valor && typeof valor.toDate === "function") {
                return valor.toDate();
            }

            if (valor) {
                const fecha = new Date(valor);
                if (!isNaN(fecha.getTime())) return fecha;
            }

            return null;
        }

        function obtenerFechaActividad(datos) {
            if (datos.creadoEn) {
                const fechaCreacion = convertirFecha(datos.creadoEn);
                if (fechaCreacion) return fechaCreacion;
            }

            return convertirFecha(datos.fecha);
        }

        function mostrarFecha(fecha) {
            if (!fecha) return "Sin fecha";

            return fecha.toLocaleString("es-AR", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function mostrarError(mensaje) {
            lista.innerHTML = `
                <div class="mensaje-historial">
                    ${escaparHTML(mensaje)}
                </div>
            `;
        }

        function nombreEmpresa(datos) {
            return datos.clienteNombre ||
                   datos.cliente ||
                   "Empresa sin nombre";
        }

        function abrirOverlay(titulo, empresa, fechaTexto, contenidoHTML) {
            const overlay = document.createElement("div");
            overlay.className = "overlay-historial";

            const ventana = document.createElement("div");
            ventana.className = "ventana-historial";

            ventana.innerHTML = `
                <h2 style="margin-top:0;color:#1f4e8c;">
                    ${escaparHTML(titulo)}
                </h2>

                <div style="color:#555;margin-bottom:5px;">
                    ${escaparHTML(empresa)}
                </div>

                <div style="font-size:13px;color:#777;margin-bottom:18px;">
                    ${escaparHTML(fechaTexto)}
                </div>

                <div>${contenidoHTML}</div>

                <button type="button" class="cerrar-historial">
                    Cerrar
                </button>
            `;

            overlay.appendChild(ventana);
            document.body.appendChild(overlay);

            ventana.querySelector(".cerrar-historial")
                .addEventListener("click", () => overlay.remove());

            overlay.addEventListener("click", evento => {
                if (evento.target === overlay) overlay.remove();
            });
        }

        function crearTarjeta(fecha, tipo, titulo, empresa, creador) {
            const tarjeta = document.createElement("div");
            tarjeta.className = "actividad-historial";

            tarjeta.innerHTML = `
                <div class="actividad-fecha">
                    ${escaparHTML(mostrarFecha(fecha))}
                </div>

                <div class="actividad-empresa">
                    🏢 ${escaparHTML(empresa)}
                </div>

                <div class="actividad-badge">${tipo}</div>

                <div class="actividad-titulo">
                    ${escaparHTML(titulo)}
                </div>

                <div class="actividad-creador">
                    Registrado por: ${escaparHTML(creador || "Usuario anterior no identificado")}
                </div>
            `;

            return tarjeta;
        }

        async function cargarHistorialCompleto() {
            lista.innerHTML = `
                <div class="mensaje-historial">Cargando historial...</div>
            `;

            try {
                const [
                    visitasSnap,
                    egresosSnap,
                    ensayosSnap,
                    cotizacionesSnap
                ] = await Promise.all([
                    getDocs(collection(db, "visitas")),
                    getDocs(collection(db, "egresos")),
                    getDocs(collection(db, "ensayos")),
                    getDocs(collection(db, "cotizaciones"))
                ]);

                const actividades = [];

                // VISITAS Y NOTAS
                visitasSnap.forEach(documento => {
                    const datos = documento.data();

                    // Las ventas se obtienen de egresos para no duplicarlas.
                    if (datos.tipoVisita === "Venta") return;

                    const esNota = datos.tipoVisita === "Nota";
                    const esEntrega = datos.tipoVisita === "Entrega de productos";

                    const esVisita =
                        datos.tipoVisita === "Nota de visita" ||
                        datos.tipoVisita === "Visita" ||
                        !datos.tipoVisita;

                    if (!esNota && !esVisita && !esEntrega) return;

                    actividades.push({
                        id: documento.id,
                        origen: esEntrega ? "entrega" : "visita",
                        datos,
                        productos: Array.isArray(datos.productos) ? datos.productos : [],
                        fecha: obtenerFechaActividad(datos),
                        empresa: nombreEmpresa(datos),
                        tipo: esNota ? "📝 Nota" : esEntrega ? "📦 Entrega" : "📍 Visita",
                        titulo: datos.titulo || (esNota ? "Nota" : esEntrega ? "Entrega de productos" : "Visita"),
                        creadoPor: datos.creadoPor || "Usuario anterior no identificado"
                    });
                });

                // VENTAS AGRUPADAS POR EMPRESA Y DÍA
                const ventasPorGrupo = new Map();

                egresosSnap.forEach(documento => {
                    const datos = documento.data();

                    if (datos.tipoEgreso !== "venta") return;

                    const fecha = obtenerFechaActividad(datos);
                    const empresa = nombreEmpresa(datos);
                    const clienteId = datos.clienteId || empresa;

                    let claveDia = "sin-fecha";

                    if (fecha) {
                        claveDia =
                            fecha.getFullYear() + "-" +
                            String(fecha.getMonth() + 1).padStart(2, "0") + "-" +
                            String(fecha.getDate()).padStart(2, "0");
                    }

                    // Separar por usuario evita mezclar ventas distintas del mismo cliente y día.
                    const uidCreador = datos.creadoPorUid || "sin-usuario";
                    const claveGrupo = `${clienteId}__${claveDia}__${uidCreador}`;

                    if (!ventasPorGrupo.has(claveGrupo)) {
                        ventasPorGrupo.set(claveGrupo, {
                            id: `venta-${claveGrupo}`,
                            origen: "venta",
                            fecha,
                            empresa,
                            tipo: "💰 Venta",
                            titulo: "Venta",
                            creadoPor: datos.creadoPor || "Usuario anterior no identificado",
                            productos: []
                        });
                    }

                    const venta = ventasPorGrupo.get(claveGrupo);

                    venta.productos.push({
                        nombre: datos.productoNombre || "Producto sin nombre",
                        cantidad: datos.cantidad,
                        unidad: datos.unidad || "",
                        lote: datos.lote || ""
                    });

                    if (fecha && (!venta.fecha || fecha > venta.fecha)) {
                        venta.fecha = fecha;
                    }
                });

                ventasPorGrupo.forEach(venta => {
                    venta.titulo =
                        `${venta.productos.length} producto` +
                        (venta.productos.length === 1 ? "" : "s");

                    actividades.push(venta);
                });

                // ENSAYOS
                ensayosSnap.forEach(documento => {
                    const datos = documento.data();

                    actividades.push({
                        id: documento.id,
                        origen: "ensayo",
                        datos,
                        fecha: obtenerFechaActividad(datos),
                        empresa: nombreEmpresa(datos),
                        tipo: "🧪 Ensayo",
                        titulo: datos.nombreEnsayo || "Ensayo",
                        creadoPor: datos.creadoPor || "Usuario anterior no identificado"
                    });
                });

                // COTIZACIONES
                cotizacionesSnap.forEach(documento => {
                    const datos = documento.data();

                    actividades.push({
                        id: documento.id,
                        origen: "cotizacion",
                        datos,
                        fecha: obtenerFechaActividad(datos),
                        empresa: nombreEmpresa(datos),
                        tipo: "📄 Cotización",
                        titulo: datos.nombreCotizacion || "Cotización",
                        creadoPor: datos.creadoPor || "Usuario anterior no identificado"
                    });
                });

                // ORDENAR DE MÁS NUEVO A MÁS VIEJO
                actividades.sort((a, b) => {
                    const fechaA = a.fecha ? a.fecha.getTime() : 0;
                    const fechaB = b.fecha ? b.fecha.getTime() : 0;
                    return fechaB - fechaA;
                });

                actividadesCargadas = actividades;
                lista.innerHTML = "";

                if (actividades.length === 0) {
                    lista.innerHTML = `
                        <div class="mensaje-historial">
                            No hay actividades registradas.
                        </div>
                    `;
                    return;
                }

                actividades.forEach(actividad => {
                    const tarjeta = crearTarjeta(
                        actividad.fecha,
                        actividad.tipo,
                        actividad.titulo,
                        actividad.empresa,
                        actividad.creadoPor || actividad.datos?.creadoPor || "Usuario anterior no identificado"
                    );

                    // VENTAS Y ENTREGAS
                    if (actividad.origen === "venta" || actividad.origen === "entrega") {
                        tarjeta.addEventListener("click", () => {
                            let productosHTML = "";

                            actividad.productos.forEach(producto => {
                                productosHTML += `
                                    <div class="producto-historial">
                                        <strong>
                                            ${escaparHTML(producto.nombre)}
                                        </strong>

                                        <p>
                                            Cantidad:
                                            ${escaparHTML(producto.cantidad ?? "-")}
                                            ${escaparHTML(producto.unidad)}
                                        </p>

                                        ${producto.lote ? `
                                            <p>
                                                Lote: ${escaparHTML(producto.lote)}
                                            </p>
                                        ` : ""}
                                    </div>
                                `;
                            });

                            abrirOverlay(
                                actividad.origen === "entrega" ? "📦 Entrega de productos" : "💰 Venta",
                                actividad.empresa,
                                mostrarFecha(actividad.fecha),
                                productosHTML || "<p>No hay productos registrados.</p>"
                            );
                        });
                    }

                    // ENSAYOS Y COTIZACIONES
                    else if (
                        actividad.origen === "ensayo" ||
                        actividad.origen === "cotizacion"
                    ) {
                        tarjeta.addEventListener("click", () => {
                            const pagina = actividad.origen === "ensayo"
                                ? `ensayo.html?id=${encodeURIComponent(actividad.id)}`
                                : `cotizacion.html?id=${encodeURIComponent(actividad.id)}`;

                            window.open(pagina, "_blank");
                        });
                    }

                    // VISITAS Y NOTAS
                    else {
                        tarjeta.addEventListener("click", () => {
                            const contenido = actividad.datos.nota || "";

                            abrirOverlay(
                                actividad.titulo,
                                actividad.empresa,
                                mostrarFecha(actividad.fecha),
                                `
                                    <div style="
                                        white-space:pre-wrap;
                                        line-height:1.5;
                                        font-size:16px;
                                        color:#333;
                                    ">
                                        ${escaparHTML(contenido || "Sin contenido.")}
                                    </div>
                                `
                            );
                        });
                    }

                    lista.appendChild(tarjeta);
                });

            } catch (error) {
                console.error("ERROR CARGANDO HISTORIAL GLOBAL:", error);
                mostrarError("No se pudo cargar el historial.");
            }
        }


        function obtenerRangoReporte() {
            const valorDesde = document.getElementById("fechaDesde").value;
            const valorHasta = document.getElementById("fechaHasta").value;
            if (!valorDesde || !valorHasta) throw new Error("Elegí las fechas Desde y Hasta.");
            const desde = new Date(valorDesde + "T00:00:00");
            const hasta = new Date(valorHasta + "T23:59:59.999");
            if (desde > hasta) throw new Error("La fecha Desde no puede ser posterior a Hasta.");
            return { desde, hasta };
        }

        function textoFechaCorta(fecha) {
            if (!fecha) return "Sin fecha";
            return fecha.toLocaleDateString("es-AR");
        }

        function generarInformePDF() {
            try {
                const { desde, hasta } = obtenerRangoReporte();
                const actividades = actividadesCargadas.filter(a => a.fecha && a.fecha >= desde && a.fecha <= hasta);
                const usuario = document.getElementById("nombreUsuario")?.textContent?.trim() || auth.currentUser?.email || "Usuario";
                const periodo = "Período seleccionado";
                const filas = actividades.map(a => {
                    let detalle = "";
                    if (a.origen === "visita") {
                        detalle = `<div class="detalle">${escaparHTML(a.datos.nota || "Sin contenido registrado.").replace(/\n/g, "<br>")}</div>`;
                    } else if (a.origen === "venta" || a.origen === "entrega") {
                        const productos = a.productos || a.datos?.productos || [];
                        detalle = productos.length
                            ? `<ul>${productos.map(p => `<li><strong>${escaparHTML(p.nombre || "Producto")}</strong> — Cantidad: ${escaparHTML(p.cantidad ?? "-")} ${escaparHTML(p.unidad || "")}${p.lote ? ` — Lote: ${escaparHTML(p.lote)}` : ""}</li>`).join("")}</ul>`
                            : "<div class=\"detalle\">Sin productos registrados.</div>";
                    } else {
                        detalle = `<div class="detalle resumido">${escaparHTML(a.titulo)}</div>`;
                    }
                    return `<article class="actividad">
                        <div class="meta">${escaparHTML(textoFechaCorta(a.fecha))} · ${escaparHTML(a.tipo.replace(/^\S+\s*/, ""))}</div>
                        <div class="meta">Registrado por: ${escaparHTML(a.creadoPor || a.datos?.creadoPor || "Usuario anterior no identificado")}</div>
                        <h2>${escaparHTML(a.empresa)}</h2>
                        <h3>${escaparHTML(a.titulo)}</h3>
                        ${detalle}
                    </article>`;
                }).join("");
                const conteo = {
                    visitas: actividades.filter(a => a.origen === "visita" && a.tipo.includes("Visita")).length,
                    notas: actividades.filter(a => a.origen === "visita" && a.tipo.includes("Nota")).length,
                    ventas: actividades.filter(a => a.origen === "venta").length,
                    cotizaciones: actividades.filter(a => a.origen === "cotizacion").length,
                    ensayos: actividades.filter(a => a.origen === "ensayo").length
                };
                const ventana = window.open("", "_blank");
                if (!ventana) {
                    alert("El navegador bloqueó la ventana del informe. Permití las ventanas emergentes para este sitio e intentá nuevamente.");
                    return;
                }
                ventana.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe INLACT</title>
                    <style>
                    body{font-family:Arial,sans-serif;color:#263445;margin:28px;font-size:12px}
                    header{display:flex;align-items:center;gap:18px;border-bottom:3px solid #1f4e8c;padding-bottom:14px;margin-bottom:18px}
                    header img{width:125px;max-height:70px;object-fit:contain}h1{color:#1f4e8c;margin:0 0 6px;font-size:24px}
                    .sub{color:#5d6b7b;margin:3px 0}.resumen{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
                    .pill{border:1px solid #d8e1eb;border-radius:7px;padding:8px 10px;background:#f5f8fc}
                    .actividad{break-inside:avoid;border-bottom:1px solid #d9e0e8;padding:12px 0}
                    .meta{color:#64748b;font-size:11px}.actividad h2{font-size:15px;color:#1f4e8c;margin:5px 0}
                    .actividad h3{font-size:13px;margin:4px 0 7px}.detalle{white-space:normal;line-height:1.5;overflow-wrap:anywhere}
                    ul{margin:6px 0;padding-left:20px}li{margin:4px 0}
                    @media print{body{margin:14mm}header{break-inside:avoid}.actividad{break-inside:avoid}}
                    </style></head><body>
                    <header><img src="${window.location.origin}/INLACT/img/logo.jpg" alt="INLACT"><div><h1>Informe de actividad</h1>
                    <p class="sub"><strong>Usuario:</strong> ${escaparHTML(usuario)}</p>
                    <p class="sub"><strong>Período:</strong> ${escaparHTML(periodo)} · ${escaparHTML(textoFechaCorta(desde))} al ${escaparHTML(textoFechaCorta(hasta))}</p>
                    <p class="sub"><strong>Generado:</strong> ${escaparHTML(new Date().toLocaleString("es-AR"))}</p></div></header>
                    <div class="resumen">
                    <span class="pill">Visitas: ${conteo.visitas}</span><span class="pill">Notas: ${conteo.notas}</span>
                    <span class="pill">Ventas: ${conteo.ventas}</span><span class="pill">Cotizaciones: ${conteo.cotizaciones}</span><span class="pill">Ensayos: ${conteo.ensayos}</span>
                    </div>
                    ${filas || "<p>No hay actividades para el período seleccionado.</p>"}
                    <script>window.onload=()=>setTimeout(()=>window.print(),500);<\/script></body></html>`);
                ventana.document.close();
            } catch (error) {
                alert(error.message || "No se pudo generar el informe.");
            }
        }

        document.getElementById("btnGenerarReporte").addEventListener("click", generarInformePDF);

        document.getElementById("volverInicioBtn")
            .addEventListener("click", () => {
                window.location.href = "index.html";
            });

        // PROTECCIÓN: iniciar el historial solo después de validar el acceso.
        try {
            await import("./usuario-menu.js");
            await protegerPagina();
            await cargarHistorialCompleto();
        } catch (error) {
            console.error("No se pudo validar el acceso al historial:", error);
            window.location.replace("login.html");
        }
    </script>

</body>
</html>
