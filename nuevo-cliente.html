<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Nuevo cliente</title>

    <!-- SEO / Mobile -->
    <meta name="description" content="INLACT - Crear nuevo cliente">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="nuevo-cliente.css">
</head>

<body style="visibility: hidden;">

<header>
       <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>


    <h2>NICOLÁS PAJARES</h2>
</header>

<main>

<!-- ===============================
     FORMULARIO NUEVO CLIENTE
================================ -->
<section class="card card-formulario">

    <h1>Crear nuevo cliente</h1>

    <form id="formNuevoCliente">

        <label>Nombre del cliente</label>
        <input id="nombre" placeholder="Ej: Lácteos San Martín" required>

        <label>Localidad</label>
        <input id="localidad" placeholder="Ej: Villa María">

        <label>Provincia</label>
        <input id="provincia" placeholder="Ej: Córdoba">

        <label>Latitud</label>
        <input id="lat" placeholder="-32.4075" required>

        <label>Longitud</label>
        <input id="lng" placeholder="-63.2408" required>

        <label>Radio de detección (metros)</label>
        <input id="radio" placeholder="1000" value="1000">

        <div class="acciones-form">
            <button type="submit" class="btn-guardar">
                💾 Guardar cliente
            </button>

            <button type="button" class="btn-cancelar"
                onclick="location.href='clientes.html'">
                ✖ Cancelar
            </button>
        </div>

    </form>

</section>

</main>

<footer>
    <p>© INLACT · <a href="aviso-legal.html">Aviso Legal</a></p>
</footer>


<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina().then(async () => {
    await import("./productos.js");
  });
</script>
</body>
</html>


</body>
</html>
