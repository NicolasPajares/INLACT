<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="INLACT - Nueva cotización"
    >

    <title>Nueva cotización · INLACT</title>

    <!-- CSS BASE -->
    <link
        rel="stylesheet"
        href="index.css"
    >

    <!-- CSS ESPECÍFICO -->
    <link
        rel="stylesheet"
        href="nueva-cotizacion.css"
    >

</head>


<body style="visibility: hidden;">


<!-- =========================================================
     HEADER
========================================================= -->


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>



<!-- =========================================================
     CONTENIDO
========================================================= -->

<main>

<section class="card-formulario">

    <h1>
        Nueva cotización
    </h1>


    <form id="formNuevaCotizacion">


        <!-- =================================================
             CLIENTE
        ================================================== -->

        <label for="cliente">
            Cliente
        </label>

        <select
            id="cliente"
            required
        >

            <option value="">
                Seleccionar cliente
            </option>

        </select>


        <!-- =================================================
             FECHA
        ================================================== -->

        <label for="fecha">
            Fecha de cotización
        </label>

        <input
            type="date"
            id="fecha"
            required
        >


        <!-- =================================================
             NOMBRE
        ================================================== -->

        <label for="nombreCotizacion">
            Nombre de la cotización
        </label>

        <input
            type="text"
            id="nombreCotizacion"
            placeholder="Ej.: Cotización Cultivos Agosto 2026"
            required
        >


        <!-- =================================================
             PROPUESTA
        ================================================== -->

        <label for="propuesta">
            Propuesta
        </label>

        <textarea
            id="propuesta"
            placeholder="Detalle de la propuesta..."
        ></textarea>


        <!-- =================================================
             DOSIS
        ================================================== -->

        <label for="dosis">
            Dosis
        </label>

        <textarea
            id="dosis"
            placeholder="Indicar dosis o recomendaciones de uso..."
        ></textarea>


        <!-- =================================================
             LISTA DE PRECIOS
        ================================================== -->

        <label for="listaPrecios">
            Lista de precios
        </label>

        <select
            id="listaPrecios"
        >

            <option value="">
                Seleccionar lista de precios
            </option>

        </select>


        <!-- =================================================
             COTIZACIÓN
        ================================================== -->

        <hr>

        <h2>
            Cotización
        </h2>


        <div id="listaProductosCotizacion"></div>


        <button
            type="button"
            id="btnAgregarProductoCotizacion"
            class="btn-agregar"
        >
            ➕ Agregar producto
        </button>


        <!-- =================================================
             OBSERVACIONES
        ================================================== -->

        <label for="observaciones">
            Observaciones
        </label>

        <textarea
            id="observaciones"
            placeholder="Condiciones de pago, anticipación del pedido, validez de la cotización, etc."
        ></textarea>


        <!-- =================================================
             ACCIONES
        ================================================== -->

        <div class="acciones-form">

            <button
                type="submit"
                class="btn-guardar"
            >
                💾 Guardar cotización
            </button>


            <button
                type="button"
                class="btn-cancelar"
                onclick="location.href='precios.html'"
            >
                ✖ Cancelar
            </button>

        </div>


    </form>

</section>

</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    <p>
        © INLACT ·
        <a href="aviso-legal.html">
            Aviso Legal
        </a>
    </p>

</footer>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->


<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina().then(async () => {
      await import("./usuario-menu.js");
      await import("./nueva-cotizacion.js");
  });
</script>
</body>
</html>
