<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ensayo</title>
  <link rel="stylesheet" href="ensayo.css" />
</head>
<body>

<div class="contenedor-ensayo">

  <aside class="menu-lateral">
    <h2 id="empresa"></h2>
    <p id="nombre-ensayo"></p>
    <p id="fecha"></p>

    <button data-seccion="propuesta">Propuesta</button>
    <button data-seccion="dosis">Dosis</button>
    <button data-seccion="elaboracion">Elaboración</button>
    <button data-seccion="resultados">Resultados</button>
    <button data-seccion="conclusion">Conclusión</button>
    <button data-seccion="propuestacomercial">Propuesta comercial</button>
    <button data-seccion="fotos">Fotos</button>
  </aside>

  <main class="contenido">

    <div class="bloque" id="bloque-propuesta">
      <h3>Propuesta</h3>
      <div id="propuesta"></div>
    </div>

    <div class="bloque" id="bloque-dosis">
      <h3>Dosis</h3>
      <div id="dosis"></div>
    </div>

    <div class="bloque" id="bloque-elaboracion">
      <h3>Elaboración</h3>
      <div id="elaboracion"></div>
    </div>

    <div class="bloque" id="bloque-resultados">
      <h3>Resultados</h3>
      <div id="resultados"></div>
    </div>

    <div class="bloque" id="bloque-conclusion">
      <h3>Conclusión</h3>
      <div id="conclusion"></div>
    </div>

    <div class="bloque" id="bloque-propuestacomercial">
      <h3>Propuesta comercial</h3>
      <div id="propuestacomercial"></div>
    </div>

    <div class="bloque">
      <h3>Fotos</h3>
      <div id="fotos" class="fotos"></div>
    </div>

  </main>

</div>

<script type="module" src="ensayo.js"></script>
</body>
</html>
