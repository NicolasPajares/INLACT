<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <!-- SEO / Mobile -->
    <meta name="description" content="INLACT - Gestión de stock">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock - INLACT</title>

    <!-- CSS base (misma estética que index) -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico de stock -->
    <link rel="stylesheet" href="stock.css">

</head>

<body>


<!-- ===============================
     ENCABEZADO
================================ -->

<h2>NICOLÁS PAJARES</h2>


<!-- ===============================
     MENÚ PRINCIPAL
================================ -->

<a href="clientes.html" class="action-card">
    <img src="img/icon-clientes.svg" alt="">
    <span>Clientes</span>
</a>

<a href="stock.html" class="action-card active">
    <img src="img/icon-stock.svg" alt="">
    <span>Stock</span>
</a>

<a href="ensayos.html" class="action-card">
    <img src="img/icon-ensayos.svg" alt="">
    <span>Ensayos</span>
</a>

<a href="precios.html" class="action-card">
    <img src="img/icon-precios.svg" alt="">
    <span>Precios</span>
</a>


<!-- ===============================
     CONTENIDO STOCK
================================ -->

<main>


    <!-- ===============================
         BOTONES DE STOCK
    ================================ -->

    <button id="btnProductos">
        📦 Productos
    </button>

    <button id="btnUbicaciones">
        📍 Ubicaciones
    </button>

    <button id="btnIngreso">
        📥 Ingreso de stock
    </button>

    <button id="btnEgreso">
        📤 Egreso de stock
    </button>

    <button id="btnTransferencia">
        🔄 Transferencia
    </button>


    <!-- ===============================
         EXISTENCIAS
    ================================ -->

    <h2>Existencias</h2>


    <!-- BUSCADOR ÚNICO -->

    <input
        type="text"
        id="buscadorStock"
        placeholder="Buscar producto o ubicación..."
        autocomplete="off"
    >


    <!-- LISTA DE EXISTENCIAS -->

    <ul id="listaStock"></ul>


    <!-- ===============================
         VOLVER
    ================================ -->

    <button id="btnVolver">
        ⬅ Volver al inicio
    </button>


</main>


<!-- ===============================
     JAVASCRIPT
================================ -->

<script type="module" src="stock.js"></script>

</html>
