<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Clientes</title>

    <!-- SEO / Mobile -->
    <meta name="description" content="INLACT - Gestión de clientes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base (misma estética que index) -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico de clientes -->
    <link rel="stylesheet" href="clientes.css">
</head>

<body style="visibility: hidden;">


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>

<main>

<!-- ===============================
     ACCESOS RÁPIDOS (IGUAL A INDEX)
================================ -->
<section class="quick-actions">
    <a href="clientes.html" class="action-card active">
        <img src="img/icon-clientes.svg" alt="">
        <span>Clientes</span>
    </a>

    <a href="stock.html" class="action-card">
        <img src="img/icon-stock.svg" alt="">
        <span>Stock</span>
    </a>

    <a href="ensayos.html" class="action-card">
        <img src="img/icon-ensayos.svg" alt="">
        <span>Ensayos</span>
    </a>

    <a href="precios.html" class="action-card">
        <img src="img/icon-precios.svg" alt="">
        <span>Precios</span>
    </a>
</section>

<!-- ===============================
     GESTIÓN DE CLIENTES
================================ -->
<section class="card">

    <button id="btnNuevoCliente">
        ➕ Crear nuevo cliente
    </button>

    <h2>Listado de clientes</h2>

    <input
        type="text"
        id="buscadorClientes"
        placeholder="Buscar cliente por nombre o localidad..."
    >

    <ul id="listaClientes"></ul>

</section>

<!-- ===============================
     VOLVER
================================ -->
<section style="text-align:center; margin-top:20px;">
    <button onclick="window.location.href='index.html'">
        ⬅ Volver al inicio
    </button>
</section>

</main>

<footer>
    <p>© INLACT · <a href="aviso-legal.html">Aviso Legal</a></p>
</footer>

<!-- JS -->

<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina()
    .then(async () => {
        await import("./usuario-menu.js");
        await import("./clientes.js");
    })
    .catch((error) => {
      console.error("Error al proteger la página de clientes:", error);
    });
</script>

</body>
</html>
