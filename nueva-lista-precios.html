<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Nueva lista de precios</title>

    <meta name="description" content="INLACT - Nueva lista de precios">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="nueva-lista-precios.css">
</head>

<body style="visibility: hidden;">


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>

<main>

<section class="card card-formulario">

    <h1>Crear nueva lista de precios</h1>

    <form id="formNuevaLista">

        <label for="nombreLista">
            Nombre de la lista
        </label>

        <input
            type="text"
            id="nombreLista"
            placeholder="Ej.: Lista General Agosto 2026"
            required
        >

        <label for="fecha">
            Fecha
        </label>

        <input
            type="date"
            id="fecha"
            required
        >

        <hr>

        <h2>Productos</h2>

       <div id="listaProductos"></div>

        <button
    type="button"
    id="btnAgregarProducto"
    class="btn-agregar"
>
    ➕ Agregar producto
</button>
            <div class="acciones-form">

            <button
                type="submit"
                class="btn-guardar"
            >
                💾 Guardar lista de precios
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="location.href='lista-precios.html'"
            >
                ✖ Cancelar
            </button>

        </div>

    </form>

</section>

</main>

<footer>
    <p>
        © INLACT ·
        <a href="aviso-legal.html">
            Aviso Legal
        </a>
    </p>
</footer>


<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina().then(async () => {
      await import("./usuario-menu.js");
      await import("./nueva-lista-precios.js");
  });
</script>
</body>
</html>
