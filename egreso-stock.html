<!DOCTYPE html>
<html lang="es">

<head>

    <!-- SEO / Mobile -->
    <meta name="description" content="INLACT - Egreso de stock">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="egreso-stock.css">

    <title>INLACT · Egreso de Stock</title>

</head>

<body>

<header>

    <figure>
        <img src="img/logo.jpg" alt="INLACT">
    </figure>

    <h2>NICOLÁS PAJARES</h2>

</header>


<main>

<!-- ============================================================
     FORMULARIO EGRESO STOCK
============================================================ -->

<section class="card card-formulario">

    <form id="formEgresoStock">

        <h1>Egreso de Stock</h1>


        <!-- ====================================================
             FECHA
        ===================================================== -->

        <label for="fecha">
            Fecha de egreso
        </label>

        <input
            type="date"
            id="fecha"
            required
        >


        <!-- ====================================================
             TIPO DE EGRESO
        ===================================================== -->

        <label for="tipoEgreso">
            Tipo de egreso
        </label>

        <select id="tipoEgreso" required>

            <option value="">
                Seleccionar tipo de egreso
            </option>

            <option value="ajuste">
                🔧 Ajuste de stock
            </option>

            <option value="venta">
                🧾 Venta / entrega a cliente
            </option>

        </select>


        <!-- ====================================================
             CLIENTE
             SOLO PARA VENTAS
        ===================================================== -->

        <div id="contenedorCliente">

            <label for="clienteBuscador">
                Cliente
            </label>

            <input
                type="text"
                id="clienteBuscador"
                placeholder="Escribí para buscar un cliente..."
                autocomplete="off"
            >

            <div id="listaClientes"></div>

            <!-- ID REAL DEL CLIENTE -->
            <input
                type="hidden"
                id="cliente"
            >

        </div>


        <!-- ====================================================
             ARTÍCULOS
             EL JS GENERARÁ UNO O VARIOS
        ===================================================== -->

        <div id="articulosEgreso">


            <!-- =================================================
                 ARTÍCULO INICIAL
            ================================================== -->

            <div
                class="articulo-egreso"
                data-articulo="1"
            >

                <!-- =============================================
                     PRODUCTO
                ============================================== -->

                <label for="productoBuscador-1">
                    Producto
                </label>

                <input
                    type="text"
                    id="productoBuscador-1"
                    class="productoBuscador"
                    placeholder="Escribí para buscar un producto..."
                    autocomplete="off"
                    required
                >

                <div
                    class="listaProductos"
                    id="listaProductos-1"
                ></div>


                <!-- ID REAL DEL PRODUCTO -->

                <input
                    type="hidden"
                    class="producto"
                    id="producto-1"
                >


                <!-- =============================================
                     UBICACIÓN
                ============================================== -->

                <label for="ubicacion-1">
                    Ubicación de origen
                </label>

                <select
                    id="ubicacion-1"
                    class="ubicacion"
                    required
                >

                    <option value="">
                        Seleccionar ubicación
                    </option>

                </select>


                <!-- =============================================
                     LOTE
                ============================================== -->

                <label for="lote-1">
                    Lote
                </label>

                <select
                    id="lote-1"
                    class="lote"
                    required
                >

                    <option value="">
                        Seleccionar lote
                    </option>

                </select>


                <!-- =============================================
                     DISPONIBILIDAD
                     NO ES UN CAMPO INDEPENDIENTE.
                     EL JS LA MOSTRARÁ JUNTO AL LOTE.
                ============================================== -->

                <div
                    class="disponibilidad-lote"
                    id="disponibilidad-1"
                ></div>


                <!-- =============================================
                     CANTIDAD A ENTREGAR
                ============================================== -->

                <label for="cantidad-1">
                    Cantidad a entregar
                </label>

                <input
                    type="number"
                    id="cantidad-1"
                    class="cantidad"
                    placeholder="Ej: 10"
                    min="0.01"
                    step="any"
                    required
                >


                <!-- =============================================
                     OBSERVACIÓN
                ============================================== -->

                <label for="observacion-1">
                    Observación
                </label>

                <textarea
                    id="observacion-1"
                    class="observacion"
                    placeholder="Ej: Entrega al cliente / Ajuste por inventario"
                    rows="3"
                ></textarea>


            </div>


        </div>


        <!-- ====================================================
             AGREGAR OTRO ARTÍCULO
        ===================================================== -->

        <button
            type="button"
            id="btnAgregarArticulo"
            class="btn-agregar-articulo"
        >
            ＋ Agregar otro producto
        </button>


        <!-- ====================================================
             RESUMEN
        ===================================================== -->

        <section
            id="resumenEgreso"
            class="resumen-egreso"
        >

            <h2>
                Resumen de la entrega
            </h2>

            <div
                id="listaResumenEgreso"
            ></div>

        </section>


        <!-- ====================================================
             ACCIONES
        ===================================================== -->

        <div class="acciones-form">

            <button
                type="submit"
                class="btn-guardar"
            >
                💾 Registrar egreso
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="location.href='stock.html'"
            >
                ✖ Cancelar
            </button>

        </div>


    </form>

</section>


<!-- ============================================================
     FOOTER
============================================================ -->

<p>

    © INLACT ·

    <a href="aviso-legal.html">
        Aviso Legal
    </a>

</p>


</main>


<!-- ============================================================
     JAVASCRIPT
============================================================ -->

<script
    type="module"
    src="egreso-stock.js">
</script>


</body>

</html>
