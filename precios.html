<!DOCTYPE html>
<html lang="es">
<head>

    <title>INLACT · Precios</title>

    <meta name="description" content="INLACT - Gestión de precios y cotizaciones">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="precios.css">

<body>

<header>
    <figure>
        <img src="img/logo.jpg" alt="INLACT">

<main>

================================ -->

    <a href="stock.html" class="action-card">

        <img src="img/icon-precios.svg" alt="">

================================ -->
