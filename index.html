<script type="module">


import {

    getApps,

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs

}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* ============================================================
   FIREBASE
   ============================================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpCO82XE8I990mWw4Fe8EVwmUOAeLZdv4",

    authDomain:
        "inlact.firebaseapp.com",

    projectId:
        "inlact",

    storageBucket:
        "inlact.appspot.com",

    messagingSenderId:
        "143868382036",

    appId:
        "1:143868382036:web:b5af0e4faced7e880216c1"

};


/*
 * IMPORTANTE
 *
 * app.js ya puede haber inicializado Firebase.
 *
 * Por eso NO usamos directamente:
 *
 * initializeApp(firebaseConfig)
 *
 * porque produciría:
 *
 * FirebaseError:
 * Firebase App named '[DEFAULT]' already exists
 *
 * Usamos la aplicación existente si ya está creada.
 */

const app =
    getApps().length
        ? getApps()[0]
        : initializeApp(
            firebaseConfig
        );


const db =
    getFirestore(
        app
    );



/* ============================================================
   ELEMENTOS
   ============================================================ */

const lista =
    document.getElementById(
        "listaVisitas"
    );



/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escaparHTML(
    texto
) {

    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* ============================================================
   FECHA
   ============================================================ */

function obtenerFecha(
    item
) {


    /*
     * Firebase Timestamp
     */

    if (

        item.fecha &&

        typeof item.fecha.toDate ===
        "function"

    ) {

        return item.fecha.toDate();

    }



    /*
     * Fecha guardada como YYYY-MM-DD
     */

    if (

        typeof item.fecha ===
        "string" &&

        item.fecha.trim() !== ""

    ) {


        const partes =
            item.fecha.split("-");


        if (

            partes.length ===
            3

        ) {


            const año =
                Number(
                    partes[0]
                );


            const mes =
                Number(
                    partes[1]
                ) - 1;


            const dia =
                Number(
                    partes[2]
                );


            return new Date(

                año,

                mes,

                dia

            );

        }



        /*
         * Intento alternativo
         */

        const fecha =
            new Date(
                item.fecha
            );


        if (

            !isNaN(
                fecha.getTime()
            )

        ) {

            return fecha;

        }

    }


    return null;

}



/* ============================================================
   MOSTRAR FECHA
   ============================================================ */

function mostrarFecha(
    fecha
) {


    if (!fecha) {

        return "";

    }


    return fecha.toLocaleString(

        "es-AR",

        {

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }

    );

}



/* ============================================================
   CARGAR ACTIVIDADES
   ============================================================ */

async function cargarUltimasActividades() {


    lista.innerHTML =
        "<li>Cargando...</li>";


    try {


        /*
         * Cargamos simultáneamente:
         *
         * visitas
         * egresos
         */

        const [

            visitasSnap,

            egresosSnap

        ] = await Promise.all([


            getDocs(

                collection(

                    db,

                    "visitas"

                )

            ),


            getDocs(

                collection(

                    db,

                    "egresos"

                )

            )

        ]);



        /* ====================================================
           GUARDAR EGRESOS
           ==================================================== */

        const egresos = [];


        egresosSnap.forEach(

            docSnap => {


                egresos.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }

        );



        /* ====================================================
           MAPA DE EGRESOS
           ==================================================== */

        const egresosPorId =
            new Map();


        egresos.forEach(

            egreso => {


                egresosPorId.set(

                    egreso.id,

                    egreso

                );

            }

        );



        /* ====================================================
           ACTIVIDADES
           ==================================================== */

        const actividades = [];



        /* ====================================================
           VENTAS AGRUPADAS
           ==================================================== */

        const ventasAgrupadas =
            new Map();



        /*
         * Primero recorremos VISITAS.
         *
         * Las visitas de tipo "Venta"
         * se convierten en una sola actividad.
         *
         * Si contienen varios egresoId,
         * todos los productos aparecen
         * dentro de la misma venta.
         */

        visitasSnap.forEach(

            docSnap => {


                const v =
                    docSnap.data();



                /* =================================================
                   VENTA
                   ================================================= */

                if (

                    v.tipoVisita ===
                    "Venta"

                ) {


                    let ids =
                        v.egresoId;



                    /*
                     * Compatibilidad con registros
                     * antiguos que tengan un único ID.
                     */

                    if (

                        !Array.isArray(
                            ids
                        )

                    ) {

                        ids =
                            ids
                                ? [ids]
                                : [];

                    }



                    /* =================================================
                       PRODUCTOS DE LA VENTA
                       ================================================= */

                    let productos = [];


                    ids.forEach(

                        id => {


                            const egreso =
                                egresosPorId.get(
                                    id
                                );


                            if (

                                egreso &&

                                egreso.tipoEgreso ===
                                "venta"

                            ) {


                                productos.push({

                                    nombre:
                                        egreso.productoNombre ||
                                        "Producto sin nombre",

                                    cantidad:
                                        egreso.cantidad,

                                    unidad:
                                        egreso.unidad ||
                                        "",

                                    lote:
                                        egreso.lote ||
                                        ""

                                });

                            }

                        }

                    );



                    /*
                     * Si no encontramos los egresos,
                     * usamos los productos guardados
                     * en la visita.
                     */

                    if (

                        productos.length ===
                        0 &&

                        Array.isArray(
                            v.productos
                        )

                    ) {


                        productos =
                            v.productos.map(

                                p => ({

                                    nombre:
                                        p.nombre ||
                                        "Producto sin nombre",

                                    cantidad:
                                        p.cantidad,

                                    unidad:
                                        p.unidad ||
                                        "",

                                    lote:
                                        p.lote ||
                                        ""

                                })

                            );

                    }



                    const fecha =
                        obtenerFecha(
                            v
                        );


                    const cliente =
                        v.clienteNombre ||
                        v.cliente ||
                        "Cliente sin nombre";



                    /* =================================================
                       CLAVE DE AGRUPACIÓN
                       ================================================= */

                    let clave;



                    /*
                     * 1. Si existe ventaId,
                     * usamos ventaId.
                     */

                    if (
                        v.ventaId
                    ) {

                        clave =
                            "venta-" +
                            v.ventaId;

                    }



                    /*
                     * 2. Si existe un array
                     * de egresoId,
                     * usamos esos IDs.
                     */

                    else if (

                        Array.isArray(
                            v.egresoId
                        ) &&

                        v.egresoId.length

                    ) {


                        clave =
                            "egresos-" +

                            [
                                ...v.egresoId
                            ]

                                .sort()

                                .join("-");

                    }



                    /*
                     * 3. Compatibilidad con
                     * registros anteriores.
                     */

                    else {


                        const tiempo =
                            fecha

                                ? Math.floor(

                                    fecha.getTime() /
                                    60000

                                )

                                : 0;


                        clave =
                            "cliente-" +

                            cliente +

                            "-fecha-" +

                            tiempo;

                    }



                    /* =================================================
                       AGRUPAR
                       ================================================= */

                    if (

                        ventasAgrupadas.has(
                            clave
                        )

                    ) {


                        const venta =
                            ventasAgrupadas.get(
                                clave
                            );


                        /*
                         * Agregamos productos
                         * sin repetir cliente,
                         * fecha ni Venta.
                         */

                        productos.forEach(

                            producto => {

                                venta.productos.push(
                                    producto
                                );

                            }

                        );


                        /*
                         * Conservamos la fecha
                         * más reciente.
                         */

                        if (

                            fecha &&

                            (

                                !venta.fecha ||

                                fecha >
                                venta.fecha

                            )

                        ) {

                            venta.fecha =
                                fecha;

                        }

                    }


                    else {


                        ventasAgrupadas.set(

                            clave,

                            {

                                id:
                                    docSnap.id,

                                origen:
                                    "venta",

                                fecha,

                                cliente,

                                tipo:
                                    "Venta",

                                productos

                            }

                        );

                    }


                    return;

                }



                /* =================================================
                   VISITA NORMAL
                   ================================================= */

                actividades.push({

                    id:
                        docSnap.id,

                    origen:
                        "visita",

                    fecha:
                        obtenerFecha(
                            v
                        ),

                    cliente:
                        v.cliente ||
                        v.clienteNombre ||
                        "Cliente sin nombre",

                    tipo:
                        v.tipoVisita ||
                        "Sin tipo",

                    productos:
                        Array.isArray(
                            v.productos
                        )
                            ? v.productos
                            : []

                });

            }

        );



        /* ====================================================
           AGREGAR VENTAS AGRUPADAS
           ==================================================== */

        ventasAgrupadas.forEach(

            venta => {

                actividades.push(
                    venta
                );

            }

        );



        /* ====================================================
           IDs RELACIONADOS CON VENTAS
           ==================================================== */

        const idsRelacionados =
            new Set();


        visitasSnap.forEach(

            docSnap => {


                const v =
                    docSnap.data();


                if (

                    v.tipoVisita !==
                    "Venta"

                ) {

                    return;

                }


                let ids =
                    v.egresoId;


                if (

                    !Array.isArray(
                        ids
                    )

                ) {

                    ids =
                        ids
                            ? [ids]
                            : [];

                }


                ids.forEach(

                    id => {

                        if (id) {

                            idsRelacionados.add(
                                id
                            );

                        }

                    }

                );

            }

        );



        /* ====================================================
           VENTAS ANTIGUAS SIN VISITA
           ==================================================== */

        egresos.forEach(

            egreso => {


                if (

                    egreso.tipoEgreso !==
                    "venta"

                ) {

                    return;

                }



                /*
                 * Si ya pertenece a una venta
                 * mostrada anteriormente,
                 * no lo volvemos a mostrar.
                 */

                if (

                    idsRelacionados.has(
                        egreso.id
                    )

                ) {

                    return;

                }



                /*
                 * Venta antigua independiente.
                 */

                actividades.push({

                    id:
                        egreso.id,

                    origen:
                        "venta",

                    fecha:
                        obtenerFecha(
                            egreso
                        ),

                    cliente:
                        egreso.clienteNombre ||
                        "Cliente sin nombre",

                    tipo:
                        "Venta",

                    productos: [

                        {

                            nombre:
                                egreso.productoNombre ||
                                "Producto sin nombre",

                            cantidad:
                                egreso.cantidad,

                            unidad:
                                egreso.unidad ||
                                "",

                            lote:
                                egreso.lote ||
                                ""

                        }

                    ]

                });

            }

        );



        /* ====================================================
           ORDENAR
           ==================================================== */

        actividades.sort(

            (
                a,
                b
            ) => {


                const fechaA =
                    a.fecha

                        ? a.fecha.getTime()

                        : 0;


                const fechaB =
                    b.fecha

                        ? b.fecha.getTime()

                        : 0;


                return (

                    fechaB -

                    fechaA

                );

            }

        );



        /* ====================================================
           ÚLTIMAS 5 ACTIVIDADES
           ==================================================== */

        const ultimas =
            actividades.slice(

                0,

                5

            );



        lista.innerHTML =
            "";



        if (

            ultimas.length ===
            0

        ) {


            lista.innerHTML =

                "<li>No hay actividades registradas.</li>";


            return;

        }



        /* ====================================================
           MOSTRAR ACTIVIDADES
           ==================================================== */

        ultimas.forEach(

            actividad => {


                const li =
                    document.createElement(
                        "li"
                    );



                /* =================================================
                   VENTA
                   ================================================= */

                if (

                    actividad.origen ===
                    "venta"

                ) {


                    let productosHTML =
                        "";



                    if (

                        actividad.productos &&

                        actividad.productos.length

                    ) {


                        productosHTML =

                            actividad.productos

                                .map(

                                    producto => `

                                        <div class="producto-venta">

                                            <span class="dato-producto">

                                                📦
                                                ${escaparHTML(
                                                    producto.nombre
                                                )}

                                            </span>


                                            <span class="dato-cantidad">

                                                ⚖️
                                                ${escaparHTML(
                                                    producto.cantidad ?? ""
                                                )}

                                                ${escaparHTML(
                                                    producto.unidad || ""
                                                )}

                                            </span>


                                            <span class="dato-lote">

                                                🏷️
                                                ${escaparHTML(
                                                    producto.lote || ""
                                                )}

                                            </span>

                                        </div>

                                    `

                                )

                                .join(
                                    ""
                                );

                    }



                    li.innerHTML = `

                        <strong>

                            ${escaparHTML(
                                actividad.cliente
                            )}

                        </strong>

                        <br>

                        <small>

                            ${mostrarFecha(
                                actividad.fecha
                            )}

                        </small>

                        <br>

                        <span class="tag-visita tag-entrega">

                            Venta

                        </span>


                        <div class="productos-venta">

                            ${productosHTML}

                        </div>

                    `;

                }



                /* =================================================
                   VISITA / ENSAYO
                   ================================================= */

                else {


                    let clase =
                        "tag-visita";



                    if (

                        actividad.tipo ===
                        "Visita comercial"

                    ) {

                        clase +=
                            " tag-comercial";

                    }


                    else if (

                        actividad.tipo ===
                        "Ensayo"

                    ) {

                        clase +=
                            " tag-ensayo";

                    }


                    else if (

                        actividad.tipo ===
                        "Entrega de productos"

                    ) {

                        clase +=
                            " tag-entrega";

                    }



                    let productosHTML =
                        "";



                    if (

                        actividad.productos &&

                        actividad.productos.length

                    ) {


                        productosHTML =

                            actividad.productos

                                .map(

                                    p => `

                                        📦
                                        ${escaparHTML(
                                            p.nombre
                                        )}

                                        ${
                                            p.cantidad

                                                ? `(${escaparHTML(
                                                    p.cantidad
                                                )})`

                                                : ""

                                        }

                                    `

                                )

                                .join(
                                    "<br>"
                                );

                    }



                    li.innerHTML = `

                        <strong>

                            ${escaparHTML(
                                actividad.cliente
                            )}

                        </strong>

                        <br>

                        <small>

                            ${mostrarFecha(
                                actividad.fecha
                            )}

                        </small>

                        <br>

                        <span class="${clase}">

                            ${escaparHTML(
                                actividad.tipo
                            )}

                        </span>

                        ${
                            productosHTML

                                ? `

                                    <div class="productos">

                                        ${productosHTML}

                                    </div>

                                  `

                                : ""

                        }

                    `;

                }



                lista.appendChild(
                    li
                );

            }

        );

    }


    catch (error) {


        console.error(

            "Error cargando actividades:",

            error

        );


        lista.innerHTML = `

            <li>

                <strong>

                    No se pudieron cargar las actividades.

                </strong>

                <br>

                <small>

                    Revisá la consola para más información.

                </small>

            </li>

        `;

    }

}



/* ============================================================
   INICIAR
   ============================================================ */

cargarUltimasActividades();



/* ============================================================
   HISTORIAL COMPLETO
   ============================================================ */

document

    .getElementById(
        "abrir-historial"
    )

    .onclick = event => {


        event.preventDefault();


        window.open(

            "historial.html",

            "historial",

            "width=420,height=700"

        );

    };


</script>
