<!-- ============================================================
     ÚLTIMAS ACTIVIDADES
     VISITAS + ENSAYOS + VENTAS
     ============================================================ -->

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* ============================================================
   FIREBASE
   ============================================================ */


const firebaseConfig = {

    apiKey:
        "AIzaSyCpCO82XE8I990mWw4Fe8EVwmUOAeLZdv4",

    authDomain:
        "inlact.firebaseapp.com",

    projectId:
        "inlact",

    storageBucket:
        "inlact.appspot.com",

    messagingSenderId:
        "143868382036",

    appId:
        "1:143868382036:web:b5af0e4faced7e880216c1"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



/* ============================================================
   ELEMENTO
   ============================================================ */


const lista =
    document.getElementById(
        "listaVisitas"
    );



/* ============================================================
   FECHA
   ============================================================ */


function obtenerFecha(item) {


    /*
     * VISITAS
     * Firebase Timestamp
     */

    if (
        item.fecha &&
        typeof item.fecha.toDate === "function"
    ) {

        return item.fecha.toDate();

    }



    /*
     * EGRESOS
     * Actualmente guardan fecha como:
     * YYYY-MM-DD
     */

    if (
        typeof item.fecha === "string" &&
        item.fecha.trim() !== ""
    ) {

        const partes =
            item.fecha.split("-");


        if (
            partes.length === 3
        ) {

            const año =
                Number(partes[0]);

            const mes =
                Number(partes[1]) - 1;

            const dia =
                Number(partes[2]);


            return new Date(
                año,
                mes,
                dia
            );

        }


        const fecha =
            new Date(item.fecha);


        if (
            !isNaN(fecha.getTime())
        ) {

            return fecha;

        }

    }


    /*
     * Si no hay fecha
     */

    return null;

}



/* ============================================================
   FORMATEAR FECHA
   ============================================================ */


function mostrarFecha(fecha) {


    if (!fecha) {

        return "";

    }


    return fecha.toLocaleString(
        "es-AR",
        {

            day: "2-digit",

            month: "2-digit",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit"

        }
    );

}



/* ============================================================
   CARGAR ACTIVIDADES
   ============================================================ */


async function cargarUltimasActividades() {


    lista.innerHTML =
        "<li>Cargando...</li>";


    try {


        /*
         * Cargamos las dos colecciones
         *
         * visitas
         * egresos
         */

        const [
            visitasSnap,
            egresosSnap
        ] = await Promise.all([

            getDocs(
                collection(
                    db,
                    "visitas"
                )
            ),

            getDocs(
                collection(
                    db,
                    "egresos"
                )
            )

        ]);



        const actividades = [];



        /* ====================================================
           IDENTIFICAR EGRESOS DE VENTA
           ==================================================== */

        /*
         * Guardamos los ID de los egresos
         * de tipo venta.
         *
         * Esto nos permite detectar cuando
         * una venta también fue registrada
         * en "visitas".
         */

        const idsEgresosVenta =
            new Set();


        egresosSnap.forEach(
            docSnap => {

                const e =
                    docSnap.data();


                if (
                    e.tipoEgreso ===
                    "venta"
                ) {

                    idsEgresosVenta.add(
                        docSnap.id
                    );

                }

            }
        );



        /* ====================================================
           VISITAS
           ==================================================== */

        visitasSnap.forEach(
            docSnap => {


                const v =
                    docSnap.data();



                /*
                 * =================================================
                 * EVITAR DUPLICAR LAS VENTAS
                 * =================================================
                 *
                 * Cuando se registra una venta,
                 * egreso-stock.js crea:
                 *
                 * 1. Un documento en "egresos"
                 * 2. Un documento en "visitas"
                 *
                 * El documento de visitas contiene:
                 *
                 * egresoId
                 *
                 * Si ese egreso existe en "egresos",
                 * NO agregamos esta visita al INDEX.
                 *
                 * La venta será mostrada desde "egresos".
                 *
                 * IMPORTANTE:
                 *
                 * Solo hacemos esto cuando:
                 *
                 * tipoVisita === "Venta"
                 *
                 * y existe egresoId.
                 *
                 * Las demás visitas siguen funcionando
                 * exactamente igual.
                 */

                if (
                    v.tipoVisita === "Venta" &&
                    v.egresoId &&
                    idsEgresosVenta.has(
                        v.egresoId
                    )
                ) {

                    return;

                }



                const fecha =
                    obtenerFecha(v);



                actividades.push({

                    id:
                        docSnap.id,

                    origen:
                        "visita",

                    fecha,

                    cliente:
                        v.cliente ||
                        v.clienteNombre ||
                        "Cliente sin nombre",

                    tipo:
                        v.tipoVisita ||
                        "Sin tipo",

                    productos:
                        Array.isArray(
                            v.productos
                        )
                            ? v.productos
                            : []

                });

            }
        );



        /* ====================================================
           EGRESOS - SOLO VENTAS
           ==================================================== */


        egresosSnap.forEach(
            docSnap => {


                const e =
                    docSnap.data();



                /*
                 * Solo mostramos ventas.
                 *
                 * Otros egresos de stock
                 * no aparecen en Últimas visitas.
                 */

                if (
                    e.tipoEgreso !==
                    "venta"
                ) {

                    return;

                }



                const fecha =
                    obtenerFecha(e);



                actividades.push({

                    id:
                        docSnap.id,

                    origen:
                        "venta",

                    fecha,

                    cliente:
                        e.clienteNombre ||
                        "Cliente sin nombre",

                    tipo:
                        "Venta",

                    productoNombre:
                        e.productoNombre ||
                        "Producto sin nombre",

                    cantidad:
                        e.cantidad,

                    unidad:
                        e.unidad ||
                        "",

                    lote:
                        e.lote ||
                        "Sin lote"

                });

            }
        );



        /* ====================================================
           ORDENAR POR FECHA
           MÁS RECIENTE PRIMERO
           ==================================================== */


        actividades.sort(
            (a, b) => {


                const fechaA =
                    a.fecha
                        ? a.fecha.getTime()
                        : 0;


                const fechaB =
                    b.fecha
                        ? b.fecha.getTime()
                        : 0;


                return fechaB - fechaA;

            }
        );



        /*
         * Mostrar solamente
         * las últimas 5
         */

        const ultimas =
            actividades.slice(
                0,
                5
            );



        lista.innerHTML =
            "";



        if (
            ultimas.length === 0
        ) {

            lista.innerHTML =
                "<li>No hay actividades registradas.</li>";

            return;

        }



        /* ====================================================
           MOSTRAR
           ==================================================== */


        ultimas.forEach(
            actividad => {


                const li =
                    document.createElement(
                        "li"
                    );



                /* =================================================
                   VENTA
                   ================================================= */


                if (
                    actividad.origen ===
                    "venta"
                ) {


                    li.innerHTML = `

                        <strong>
                            ${actividad.cliente}
                        </strong>

                        <br>

                        <small>
                            ${mostrarFecha(
                                actividad.fecha
                            )}
                        </small>

                        <br>

                        <span class="tag-visita tag-entrega">
                            Venta
                        </span>

                        <div class="productos">

                            📦
                            ${actividad.productoNombre}

                            <br>

                            📊
                            ${actividad.cantidad}
                            ${actividad.unidad}

                            <br>

                            🏷️
                            Lote:
                            ${actividad.lote}

                        </div>

                    `;

                }



                /* =================================================
                   VISITA / ENSAYO
                   ================================================= */


                else {


                    let clase =
                        "tag-visita";



                    if (
                        actividad.tipo ===
                        "Visita comercial"
                    ) {

                        clase +=
                            " tag-comercial";

                    }


                    else if (
                        actividad.tipo ===
                        "Ensayo"
                    ) {

                        clase +=
                            " tag-ensayo";

                    }


                    else if (
                        actividad.tipo ===
                        "Entrega de productos"
                    ) {

                        clase +=
                            " tag-entrega";

                    }



                    let productosHTML =
                        "";



                    if (
                        actividad.productos &&
                        actividad.productos.length
                    ) {


                        productosHTML =
                            actividad.productos
                                .map(
                                    p => `

                                        📦
                                        ${p.nombre}

                                        ${
                                            p.cantidad
                                                ? `(${p.cantidad})`
                                                : ""
                                        }

                                    `
                                )
                                .join(
                                    "<br>"
                                );

                    }



                    li.innerHTML = `

                        <strong>
                            ${actividad.cliente}
                        </strong>

                        <br>

                        <small>
                            ${mostrarFecha(
                                actividad.fecha
                            )}
                        </small>

                        <br>

                        <span
                            class="${clase}">
                            ${actividad.tipo}
                        </span>

                        ${
                            productosHTML
                                ? `
                                    <div class="productos">
                                        ${productosHTML}
                                    </div>
                                  `
                                : ""
                        }

                    `;

                }



                lista.appendChild(
                    li
                );

            }
        );


    }


    catch (error) {


        console.error(
            "Error cargando actividades:",
            error
        );


        lista.innerHTML = `

            <li>

                <strong>
                    No se pudieron cargar las actividades.
                </strong>

            </li>

        `;

    }

}



/* ============================================================
   INICIAR
   ============================================================ */


cargarUltimasActividades();



/* ============================================================
   HISTORIAL COMPLETO
   ============================================================ */


document
    .getElementById(
        "abrir-historial"
    )
    .onclick = event => {


        event.preventDefault();


        window.open(
            "historial.html",
            "historial",
            "width=420,height=700"
        );

    };


</script>
