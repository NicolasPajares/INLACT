     VISITAS + ENSAYOS + VENTAS
     ========================================================= -->

<script type="module">


/* ============================================================
   FIREBASE
   ============================================================ */

import {
    getApp,
    getApps
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/*
 * app.js ya inicializa Firebase.
 *
 * Por eso NO volvemos a ejecutar initializeApp().
 *
 * Si app.js ya creó la aplicación:
 *     usamos esa misma.
 *
 * Si por algún motivo todavía no existe:
 *     esperamos unos milisegundos y volvemos a intentar.
 */

let app = null;

let db = null;



function obtenerFirebase() {

    const apps =
        getApps();


    if (
        apps.length > 0
    ) {

        app =
            getApp();

        db =
            getFirestore(
                app
            );

        return true;

    }


    return false;

}



/* ============================================================
   ELEMENTO
   ============================================================ */

const lista =
    document.getElementById(
        "listaVisitas"
    );



/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escaparHTML(
    texto
) {

    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* ============================================================
   FECHA
   ============================================================ */

function obtenerFecha(
    item
) {


    /*
     * FIREBASE TIMESTAMP
     */

    if (
        item.fecha &&
        typeof item.fecha.toDate ===
            "function"
    ) {

        return item.fecha.toDate();

    }



    /*
     * FECHA YYYY-MM-DD
     */

    if (
        typeof item.fecha ===
            "string" &&

        item.fecha.trim() !==
            ""
    ) {

        const partes =
            item.fecha.split("-");


        if (
            partes.length ===
            3
        ) {

            const año =
                Number(
                    partes[0]
                );


            const mes =
                Number(
                    partes[1]
                ) - 1;


            const dia =
                Number(
                    partes[2]
                );


            return new Date(
                año,
                mes,
                dia
            );

        }


        const fecha =
            new Date(
                item.fecha
            );


        if (
            !isNaN(
                fecha.getTime()
            )
        ) {

            return fecha;

        }

    }


    return null;

}



/* ============================================================
   MOSTRAR FECHA
   ============================================================ */

function mostrarFecha(
    fecha
) {

    if (
        !fecha
    ) {

        return "";

    }


    return fecha.toLocaleString(
        "es-AR",
        {

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}



/* ============================================================
   NORMALIZAR PRODUCTOS
   ============================================================ */

function normalizarProducto(
    producto
) {

    if (
        !producto
    ) {

        return {

            nombre:
                "Producto sin nombre",

            cantidad:
                "",

            unidad:
                "",

            lote:
                ""

        };

    }


    return {

        nombre:
            producto.nombre ||

            producto.productoNombre ||

            producto.descripcion ||

            "Producto sin nombre",


        cantidad:
            producto.cantidad ??
            "",


        unidad:
            producto.unidad ||
            "",


        lote:
            producto.lote ||
            ""

    };

}



/* ============================================================
   CARGAR ACTIVIDADES
   ============================================================ */

async function cargarUltimasActividades() {


    lista.innerHTML =
        "<li>Cargando...</li>";


    /*
     * Firebase debe estar disponible
     */

    if (
        !obtenerFirebase()
    ) {

        /*
         * app.js todavía puede estar
         * terminando de inicializar.
         */

        setTimeout(
            cargarUltimasActividades,
            200
        );

        return;

    }


    try {


        /* ====================================================
           CARGAR VISITAS Y EGRESOS
           ==================================================== */

        const [
            visitasSnap,
            egresosSnap
        ] = await Promise.all([

            getDocs(
                collection(
                    db,
                    "visitas"
                )
            ),

            getDocs(
                collection(
                    db,
                    "egresos"
                )
            )

        ]);



        /* ====================================================
           GUARDAR EGRESOS
           ==================================================== */

        const egresos =
            [];


        egresosSnap.forEach(
            docSnap => {

                egresos.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );



        /* ====================================================
           MAPA DE EGRESOS
           ==================================================== */

        const egresosPorId =
            new Map();


        egresos.forEach(
            egreso => {

                egresosPorId.set(

                    egreso.id,

                    egreso

                );

            }
        );



        /* ====================================================
           EGRESOS QUE PERTENECEN A VENTAS AGRUPADAS
           ==================================================== */

        const egresosVentaAgrupados =
            new Set();



        visitasSnap.forEach(
            docSnap => {

                const visita =
                    docSnap.data();


                if (
                    visita.tipoVisita !==
                    "Venta"
                ) {

                    return;

                }


                let ids =
                    visita.egresoId;



                /*
                 * Las ventas nuevas
                 * tienen egresoId como ARRAY.
                 *
                 * Las antiguas pueden tener
                 * un solo ID.
                 */

                if (
                    !Array.isArray(
                        ids
                    )
                ) {

                    if (
                        ids
                    ) {

                        ids = [
                            ids
                        ];

                    } else {

                        ids = [];

                    }

                }



                ids.forEach(
                    id => {

                        if (
                            id
                        ) {

                            egresosVentaAgrupados.add(
                                id
                            );

                        }

                    }
                );

            }
        );



        /* ====================================================
           ACTIVIDADES
           ==================================================== */

        const actividades =
            [];



        /* ====================================================
           VISITAS
           ==================================================== */

        visitasSnap.forEach(
            docSnap => {

                const visita =
                    docSnap.data();



                /* =================================================
                   VENTA AGRUPADA
                   ================================================= */

                if (
                    visita.tipoVisita ===
                    "Venta"
                ) {


                    let ids =
                        visita.egresoId;



                    /*
                     * Convertir ID individual
                     * en array si hace falta.
                     */

                    if (
                        !Array.isArray(
                            ids
                        )
                    ) {

                        if (
                            ids
                        ) {

                            ids = [
                                ids
                            ];

                        } else {

                            ids = [];

                        }

                    }



                    /*
                     * BUSCAR LOS EGRESOS
                     */

                    const productosVenta =
                        ids

                            .map(
                                id =>

                                    egresosPorId.get(
                                        id
                                    )

                            )

                            .filter(
                                egreso =>

                                    egreso &&

                                    egreso.tipoEgreso ===
                                    "venta"

                            )

                            .map(
                                egreso =>

                                    normalizarProducto({

                                        nombre:
                                            egreso.productoNombre,

                                        cantidad:
                                            egreso.cantidad,

                                        unidad:
                                            egreso.unidad,

                                        lote:
                                            egreso.lote

                                    })

                            );



                    /*
                     * SI NO ENCUENTRA EGRESOS
                     *
                     * usamos lo guardado
                     * directamente en visitas.
                     */

                    let productosFinal =
                        productosVenta;



                    if (
                        productosFinal.length ===
                        0
                    ) {

                        if (
                            Array.isArray(
                                visita.productos
                            )
                        ) {

                            productosFinal =
                                visita.productos
                                    .map(
                                        normalizarProducto
                                    );

                        } else {

                            productosFinal =
                                [];

                        }

                    }



                    /*
                     * UNA SOLA ACTIVIDAD
                     *
                     * aunque tenga varios productos.
                     */

                    actividades.push({

                        id:
                            docSnap.id,

                        origen:
                            "venta",

                        fecha:
                            obtenerFecha(
                                visita
                            ),

                        cliente:
                            visita.clienteNombre ||

                            visita.cliente ||

                            "Cliente sin nombre",

                        tipo:
                            "Venta",

                        productos:
                            productosFinal

                    });


                    return;

                }



                /* =================================================
                   VISITA NORMAL
                   ================================================= */

                actividades.push({

                    id:
                        docSnap.id,

                    origen:
                        "visita",

                    fecha:
                        obtenerFecha(
                            visita
                        ),

                    cliente:
                        visita.cliente ||

                        visita.clienteNombre ||

                        "Cliente sin nombre",

                    tipo:
                        visita.tipoVisita ||

                        "Sin tipo",

                    productos:
                        Array.isArray(
                            visita.productos
                        )
                            ? visita.productos
                                .map(
                                    normalizarProducto
                                )

                            : []

                });

            }
        );



        /* ====================================================
           VENTAS ANTIGUAS / NO AGRUPADAS
           ==================================================== */

        egresos.forEach(
            egreso => {


                /*
                 * Solo ventas.
                 */

                if (
                    egreso.tipoEgreso !==
                    "venta"
                ) {

                    return;

                }



                /*
                 * Si ya pertenece
                 * a una venta agrupada,
                 * NO mostrar nuevamente.
                 */

                if (
                    egresosVentaAgrupados.has(
                        egreso.id
                    )
                ) {

                    return;

                }



                /*
                 * Venta antigua.
                 */

                actividades.push({

                    id:
                        egreso.id,

                    origen:
                        "venta",

                    fecha:
                        obtenerFecha(
                            egreso
                        ),

                    cliente:
                        egreso.clienteNombre ||

                        "Cliente sin nombre",

                    tipo:
                        "Venta",

                    productos: [

                        normalizarProducto({

                            nombre:
                                egreso.productoNombre,

                            cantidad:
                                egreso.cantidad,

                            unidad:
                                egreso.unidad,

                            lote:
                                egreso.lote

                        })

                    ]

                });

            }
        );



        /* ====================================================
           ORDENAR POR FECHA
           ==================================================== */

        actividades.sort(
            (
                a,
                b
            ) => {

                const fechaA =
                    a.fecha
                        ? a.fecha.getTime()
                        : 0;


                const fechaB =
                    b.fecha
                        ? b.fecha.getTime()
                        : 0;


                return (
                    fechaB -
                    fechaA
                );

            }
        );



        /* ====================================================
           ÚLTIMAS 5
           ==================================================== */

        const ultimas =
            actividades.slice(
                0,
                5
            );



        lista.innerHTML =
            "";



        if (
            ultimas.length ===
            0
        ) {

            lista.innerHTML =

                "<li>No hay actividades registradas.</li>";

            return;

        }



        /* ====================================================
           MOSTRAR ACTIVIDADES
           ==================================================== */

        ultimas.forEach(
            actividad => {


                const li =
                    document.createElement(
                        "li"
                    );



                /* =================================================
                   VENTA
                   ================================================= */

                if (
                    actividad.origen ===
                    "venta"
                ) {


                    let productosHTML =
                        "";



                    if (
                        actividad.productos &&

                        actividad.productos.length
                    ) {


                        productosHTML =

                            actividad.productos

                                .map(
                                    producto => `

                                        <div class="producto-venta">

                                            <span class="dato-producto">

                                                📦
                                                ${escaparHTML(
                                                    producto.nombre
                                                )}

                                            </span>


                                            <span class="dato-cantidad">

                                                ⚖️
                                                ${escaparHTML(
                                                    producto.cantidad
                                                        ?? ""
                                                )}
                                                ${escaparHTML(
                                                    producto.unidad
                                                        || ""
                                                )}

                                            </span>


                                            <span class="dato-lote">

                                                🏷️
                                                ${escaparHTML(
                                                    producto.lote
                                                        || ""
                                                )}

                                            </span>

                                        </div>

                                    `
                                )

                                .join(
                                    ""
                                );

                    }



                    li.innerHTML = `

                        <strong>
                            ${escaparHTML(
                                actividad.cliente
                            )}
                        </strong>


                        <br>


                        <small>
                            ${mostrarFecha(
                                actividad.fecha
                            )}
                        </small>


                        <br>


                        <span class="tag-visita tag-entrega">
                            Venta
                        </span>


                        <div class="productos-venta">

                            ${productosHTML}

                        </div>

                    `;

                }



                /* =================================================
                   VISITA / ENSAYO
                   ================================================= */

                else {


                    let clase =
                        "tag-visita";



                    if (
                        actividad.tipo ===
                        "Visita comercial"
                    ) {

                        clase +=
                            " tag-comercial";

                    }


                    else if (
                        actividad.tipo ===
                        "Ensayo"
                    ) {

                        clase +=
                            " tag-ensayo";

                    }


                    else if (
                        actividad.tipo ===
                        "Entrega de productos"
                    ) {

                        clase +=
                            " tag-entrega";

                    }



                    let productosHTML =
                        "";



                    if (
                        actividad.productos &&

                        actividad.productos.length
                    ) {


                        productosHTML =

                            actividad.productos

                                .map(
                                    producto => `

                                        <div class="producto-visita">

                                            📦
                                            ${escaparHTML(
                                                producto.nombre
                                            )}

                                            ${
                                                producto.cantidad !==
                                                "" &&
                                                producto.cantidad !==
                                                null &&
                                                producto.cantidad !==
                                                undefined

                                                    ? `(${escaparHTML(
                                                        producto.cantidad
                                                    )} ${escaparHTML(
                                                        producto.unidad ||
                                                        ""
                                                    )})`

                                                    : ""
                                            }

                                        </div>

                                    `
                                )

                                .join(
                                    "<br>"
                                );

                    }



                    li.innerHTML = `

                        <strong>
                            ${escaparHTML(
                                actividad.cliente
                            )}
                        </strong>


                        <br>


                        <small>
                            ${mostrarFecha(
                                actividad.fecha
                            )}
                        </small>


                        <br>


                        <span
                            class="${clase}"
                        >
                            ${escaparHTML(
                                actividad.tipo
                            )}
                        </span>


                        ${
                            productosHTML

                                ? `

                                    <div class="productos">

                                        ${productosHTML}

                                    </div>

                                  `

                                : ""

                        }

                    `;

                }



                lista.appendChild(
                    li
                );

            }
        );


    }

    catch (
        error
    ) {


        console.error(
            "Error cargando actividades:",
            error
        );


        lista.innerHTML = `

            <li>

                <strong>
                    No se pudieron cargar las actividades.
                </strong>

                <br>

                <small>
                    Revisá la consola para ver el error.
                </small>

            </li>

        `;

    }

}



/* ============================================================
   INICIAR ACTIVIDADES
   ============================================================ */

cargarUltimasActividades();



/* ============================================================
   HISTORIAL COMPLETO
   ============================================================ */

const botonHistorial =
    document.getElementById(
        "abrir-historial"
    );


if (
    botonHistorial
) {

    botonHistorial.onclick =
        event => {

            event.preventDefault();


            window.open(

                "historial.html",

                "historial",

                "width=420,height=700"

            );

        };

}


</script>
