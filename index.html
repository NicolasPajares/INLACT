<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INLACT</title>
<meta name="description" content="INLACT - Registro de visitas y clientes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
.producto-venta {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 7px 0;
}

.dato-producto {
  flex: 1;
}

.dato-cantidad {
  min-width: 100px;
}

.dato-lote {
  min-width: 130px;
}

@media (max-width: 700px) {
  .producto-venta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    padding: 7px 0;
  }

  .dato-producto,
  .dato-cantidad,
  .dato-lote {
    min-width: 0;
    width: 100%;
  }
}

/* ===============================
   NOTAS EN HISTORIAL
================================ */

.item-nota-visita {
  cursor: pointer;
  transition: background .15s ease;
  padding: 12px 8px !important;
  border-radius: 8px;
}

.item-nota-visita:hover {
  background: #f3f7fb;
}

.titulo-nota-historial {
  display: block;
  margin-top: 7px;
  font-weight: 600;
  color: #2c3e50;
}

/* ===============================
   VENTANA DE NOTA
================================ */

.overlay-nota-historial {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 99999;
}

.ventana-nota-historial {
  background: #ffffff;
  width: 92%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,.20);
}

.ventana-nota-historial h3 {
  color: #1f4e8c;
  margin-bottom: 8px;
}

.datos-nota-historial {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 18px;
}

.contenido-nota-historial {
  white-space: pre-wrap;
  line-height: 1.55;
  font-size: 16px;
  color: #2c3e50;
}

.cerrar-nota-historial {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #eeeeee;
  color: #333333;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body style="visibility: hidden;">


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>


<main>

<section class="quick-actions">

  <a href="clientes.html" class="action-card">
    <img src="img/icon-clientes.svg" alt="Clientes">
    <span>Clientes</span>
  </a>

  <a href="stock.html" class="action-card">
    <img src="img/icon-stock.svg" alt="Stock">
    <span>Stock</span>
  </a>

  <a href="ensayos.html" class="action-card">
    <img src="img/icon-ensayos.svg" alt="Ensayos">
    <span>Ensayos</span>
  </a>

  <a href="precios.html" class="action-card">
    <img src="img/icon-precios.svg" alt="Precios">
    <span>Precios</span>
  </a>

</section>


<section class="card">

  <h2>Mapa de clientes</h2>

  <div id="map"></div>

</section>


<section class="card">

  <h2>Visitas cercanas</h2>

  <p id="estado">Buscando fábricas...</p>

  <div id="acciones" class="lista-clientes"></div>

</section>


<section class="card">

  <h3>Últimas visitas</h3>

  <ul id="listaVisitas"></ul>

  <a href="#" id="abrir-historial">
    Ver historial completo →
  </a>

</section>

</main>


<footer>

  <p>
    © INLACT ·
    <a href="aviso-legal.html">Aviso Legal</a>
  </p>

</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { auth } from "./firebase.js";

  let appCargada = false;

  onAuthStateChanged(auth, async (usuario) => {
    if (!usuario) {
      window.location.replace("login.html");
      return;
    }

    document.body.style.visibility = "visible";

    if (!appCargada) {
      appCargada = true;

      try {
        await import("./usuario-menu.js");
        await import("./app.js");
      } catch (error) {
        console.error("Error al cargar el panel INLACT:", error);
      }
    }
  });
</script>




</body>
</html>
