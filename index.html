<!-- ============================================================
     ÚLTIMAS ACTIVIDADES
     VISITAS + ENSAYOS + VENTAS
     ============================================================ -->

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* ============================================================
   FIREBASE
   ============================================================ */


const firebaseConfig = {

    apiKey:
        "AIzaSyCpCO82XE8I990mW4Fe8EVwmUOAeLZdv4",

    authDomain:
        "inlact.firebaseapp.com",

    projectId:
        "inlact",

    storageBucket:
        "inlact.appspot.com",

    messagingSenderId:
        "143868382036",

    appId:
        "1:143868382036:web:b5af0e4faced7e880216c1"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



/* ============================================================
   ELEMENTO
   ============================================================ */


const lista =
    document.getElementById(
        "listaVisitas"
    );



/* ============================================================
   ESCAPAR HTML
   ============================================================ */


function escaparHTML(
    texto
) {

    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* ============================================================
   FECHA
   ============================================================ */


function obtenerFecha(
    item
) {


    /*
     * VISITAS
     * Firebase Timestamp
     */

    if (
        item.fecha &&
        typeof item.fecha.toDate === "function"
    ) {

        return item.fecha.toDate();

    }



    /*
     * EGRESOS
     * YYYY-MM-DD
     */

    if (
        typeof item.fecha === "string" &&
        item.fecha.trim() !== ""
    ) {

        const partes =
            item.fecha.split("-");


        if (
            partes.length === 3
        ) {

            const año =
                Number(
                    partes[0]
                );


            const mes =
                Number(
                    partes[1]
                ) - 1;


            const dia =
                Number(
                    partes[2]
                );


            return new Date(
                año,
                mes,
                dia
            );

        }


        const fecha =
            new Date(
                item.fecha
            );


        if (
            !isNaN(
                fecha.getTime()
            )
        ) {

            return fecha;

        }

    }


    return null;

}



/* ============================================================
   FORMATEAR FECHA
   ============================================================ */


function mostrarFecha(
    fecha
) {

    if (
        !fecha
    ) {

        return "";

    }


    return fecha.toLocaleString(
        "es-AR",
        {

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}



/* ============================================================
   CARGAR ACTIVIDADES
   ============================================================ */


async function cargarUltimasActividades() {


    lista.innerHTML =
        "<li>Cargando...</li>";


    try {


        /*
         * Cargamos:
         *
         * visitas
         * egresos
         */

        const [
            visitasSnap,
            egresosSnap
        ] = await Promise.all([

            getDocs(
                collection(
                    db,
                    "visitas"
                )
            ),

            getDocs(
                collection(
                    db,
                    "egresos"
                )
            )

        ]);


        /* ====================================================
           GUARDAR EGRESOS
           ==================================================== */

        const egresos = [];


        egresosSnap.forEach(
            docSnap => {

                egresos.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        /* ====================================================
           MAPA DE EGRESOS
           ==================================================== */

        const egresosPorId =
            new Map();


        egresos.forEach(
            egreso => {

                egresosPorId.set(
                    egreso.id,
                    egreso
                );

            }
        );


        /* ====================================================
           IDENTIFICAR VENTAS AGRUPADAS
           ==================================================== */

        const egresosVentaAgrupados =
            new Set();


        visitasSnap.forEach(
            docSnap => {

                const visita =
                    docSnap.data();


                if (
                    visita.tipoVisita !==
                    "Venta"
                ) {

                    return;

                }


                let ids =
                    visita.egresoId;


                /*
                 * El egreso-stock.js actual
                 * guarda egresoId como ARRAY.
                 *
                 * También soportamos el formato
                 * anterior donde era un solo ID.
                 */

                if (
                    !Array.isArray(ids)
                ) {

                    if (
                        ids
                    ) {

                        ids = [
                            ids
                        ];

                    } else {

                        ids = [];

                    }

                }


                ids.forEach(
                    id => {

                        if (
                            id
                        ) {

                            egresosVentaAgrupados.add(
                                id
                            );

                        }

                    }
                );

            }
        );


        /* ====================================================
           ACTIVIDADES
           ==================================================== */

        const actividades = [];


        /* ====================================================
           VISITAS
           ==================================================== */

        visitasSnap.forEach(
            docSnap => {

                const v =
                    docSnap.data();


                /* =================================================
                   VENTA AGRUPADA
                   ================================================= */

                if (
                    v.tipoVisita ===
                    "Venta"
                ) {

                    let ids =
                        v.egresoId;


                    if (
                        !Array.isArray(ids)
                    ) {

                        if (
                            ids
                        ) {

                            ids = [
                                ids
                            ];

                        } else {

                            ids = [];

                        }

                    }


                    /*
                     * Buscamos todos los egresos
                     * que pertenecen a esta venta.
                     */

                    const productosVenta =
                        ids

                            .map(
                                id =>
                                    egresosPorId.get(
                                        id
                                    )
                            )

                            .filter(
                                egreso =>
                                    egreso &&
                                    egreso.tipoEgreso ===
                                    "venta"
                            )

                            .map(
                                egreso => ({

                                    nombre:
                                        egreso.productoNombre ||
                                        "Producto sin nombre",

                                    cantidad:
                                        egreso.cantidad,

                                    unidad:
                                        egreso.unidad ||
                                        "",

                                    lote:
                                        egreso.lote ||
                                        ""

                                })
                            );


                    /*
                     * Si no encontramos los egresos,
                     * usamos los productos guardados
                     * directamente en visitas.
                     */

                    const productosFinal =
                        productosVenta.length
                            ? productosVenta
                            : (
                                Array.isArray(
                                    v.productos
                                )
                                    ? v.productos.map(
                                        p => ({

                                            nombre:
                                                p.nombre ||
                                                "Producto sin nombre",

                                            cantidad:
                                                p.cantidad,

                                            unidad:
                                                p.unidad ||
                                                "",

                                            lote:
                                                p.lote ||
                                                ""

                                        })
                                    )
                                    : []
                            );


                    /*
                     * Una sola actividad
                     * para toda la venta.
                     */

                    actividades.push({

                        id:
                            docSnap.id,

                        origen:
                            "venta",

                        fecha:
                            obtenerFecha(
                                v
                            ),

                        cliente:
                            v.clienteNombre ||
                            v.cliente ||
                            "Cliente sin nombre",

                        tipo:
                            "Venta",

                        productos:
                            productosFinal

                    });


                    return;

                }


                /* =================================================
                   VISITAS NORMALES
                   ================================================= */

                actividades.push({

                    id:
                        docSnap.id,

                    origen:
                        "visita",

                    fecha:
                        obtenerFecha(
                            v
                        ),

                    cliente:
                        v.cliente ||
                        v.clienteNombre ||
                        "Cliente sin nombre",

                    tipo:
                        v.tipoVisita ||
                        "Sin tipo",

                    productos:
                        Array.isArray(
                            v.productos
                        )
                            ? v.productos
                            : []

                });

            }
        );


        /* ====================================================
           EGRESOS DE VENTA NO AGRUPADOS
           ==================================================== */

        egresos.forEach(
            egreso => {

                if (
                    egreso.tipoEgreso !==
                    "venta"
                ) {

                    return;

                }


                /*
                 * Si ya pertenece a una venta
                 * agrupada, no lo mostramos otra vez.
                 */

                if (
                    egresosVentaAgrupados.has(
                        egreso.id
                    )
                ) {

                    return;

                }


                /*
                 * Ventas antiguas que no tienen
                 * visita asociada.
                 */

                actividades.push({

                    id:
                        egreso.id,

                    origen:
                        "venta",

                    fecha:
                        obtenerFecha(
                            egreso
                        ),

                    cliente:
                        egreso.clienteNombre ||
                        "Cliente sin nombre",

                    tipo:
                        "Venta",

                    productos: [

                        {

                            nombre:
                                egreso.productoNombre ||
                                "Producto sin nombre",

                            cantidad:
                                egreso.cantidad,

                            unidad:
                                egreso.unidad ||
                                "",

                            lote:
                                egreso.lote ||
                                ""

                        }

                    ]

                });

            }
        );


        /* ====================================================
           ORDENAR POR FECHA
           ==================================================== */

        actividades.sort(
            (
                a,
                b
            ) => {

                const fechaA =
                    a.fecha
                        ? a.fecha.getTime()
                        : 0;


                const fechaB =
                    b.fecha
                        ? b.fecha.getTime()
                        : 0;


                return (
                    fechaB -
                    fechaA
                );

            }
        );


        /* ====================================================
           MOSTRAR ÚLTIMAS 5
           ==================================================== */

        const ultimas =
            actividades.slice(
                0,
                5
            );


        lista.innerHTML =
            "";


        if (
            ultimas.length === 0
        ) {

            lista.innerHTML =
                "<li>No hay actividades registradas.</li>";

            return;

        }


        /* ====================================================
           MOSTRAR
           ==================================================== */

        ultimas.forEach(
            actividad => {

                const li =
                    document.createElement(
                        "li"
                    );


                /* =================================================
                   VENTA
                   ================================================= */

                if (
                    actividad.origen ===
                    "venta"
                ) {

                    let productosHTML =
                        "";


                    if (
                        actividad.productos &&
                        actividad.productos.length
                    ) {

                        productosHTML =
                            actividad.productos
                                .map(
                                    producto => `

                                        <div class="producto-venta">

                                            <span class="dato-producto">

                                                📦
                                                ${escaparHTML(
                                                    producto.nombre
                                                )}

                                            </span>


                                            <span class="dato-cantidad">

                                                ⚖️
                                                ${escaparHTML(
                                                    producto.cantidad ?? ""
                                                )}
                                                ${escaparHTML(
                                                    producto.unidad || ""
                                                )}

                                            </span>


                                            <span class="dato-lote">

                                                🏷️
                                                ${escaparHTML(
                                                    producto.lote || ""
                                                )}

                                            </span>

                                        </div>

                                    `
                                )
                                .join(
                                    ""
                                );

                    }


                    li.innerHTML = `

                        <strong>
                            ${escaparHTML(
                                actividad.cliente
                            )}
                        </strong>

                        <br>

                        <small>
                            ${mostrarFecha(
                                actividad.fecha
                            )}
                        </small>

                        <br>

                        <span class="tag-visita tag-entrega">
                            Venta
                        </span>


                        <div class="productos-venta">

                            ${productosHTML}

                        </div>

                    `;

                }


                /* =================================================
                   VISITA / ENSAYO
                   ================================================= */

                else {

                    let clase =
                        "tag-visita";


                    if (
                        actividad.tipo ===
                        "Visita comercial"
                    ) {

                        clase +=
                            " tag-comercial";

                    }


                    else if (
                        actividad.tipo ===
                        "Ensayo"
                    ) {

                        clase +=
                            " tag-ensayo";

                    }


                    else if (
                        actividad.tipo ===
                        "Entrega de productos"
                    ) {

                        clase +=
                            " tag-entrega";

                    }


                    let productosHTML =
                        "";


                    if (
                        actividad.productos &&
                        actividad.productos.length
                    ) {

                        productosHTML =
                            actividad.productos

                                .map(
                                    p => `

                                        📦
                                        ${escaparHTML(
                                            p.nombre ||
                                            "Producto sin nombre"
                                        )}

                                        ${
                                            p.cantidad
                                                ? `(${escaparHTML(p.cantidad)})`
                                                : ""
                                        }

                                    `
                                )

                                .join(
                                    "<br>"
                                );

                    }


                    li.innerHTML = `

                        <strong>
                            ${escaparHTML(
                                actividad.cliente
                            )}
                        </strong>

                        <br>

                        <small>
                            ${mostrarFecha(
                                actividad.fecha
                            )}
                        </small>

                        <br>

                        <span
                            class="${clase}">
                            ${escaparHTML(
                                actividad.tipo
                            )}
                        </span>

                        ${
                            productosHTML
                                ? `
                                    <div class="productos">
                                        ${productosHTML}
                                    </div>
                                  `
                                : ""
                        }

                    `;

                }


                lista.appendChild(
                    li
                );

            }
        );


    }


    catch (
        error
    ) {

        console.error(
            "Error cargando actividades:",
            error
        );


        lista.innerHTML = `

            <li>

                <strong>
                    No se pudieron cargar las actividades.
                </strong>

            </li>

        `;

    }

}



/* ============================================================
   INICIAR
   ============================================================ */


cargarUltimasActividades();



/* ============================================================
   HISTORIAL COMPLETO
   ============================================================ */


document
    .getElementById(
        "abrir-historial"
    )
    .onclick = event => {


        event.preventDefault();


        window.open(
            "historial.html",
            "historial",
            "width=420,height=700"
        );

    };


</script>
