<style>

/* ===============================

================================ */

  transition: background .15s ease;
  padding: 12px 8px !important;

.item-nota-visita:hover {

.titulo-nota-historial {
  display: block;
  margin-top: 7px;
  font-weight: 600;
  color: #2c3e50;

/* ===============================
   VENTANA DE NOTA
================================ */

.overlay-nota-historial {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 8px;
}

.datos-nota-historial {

  color: #6b7280;
  margin-bottom: 18px;

.contenido-nota-historial {
  white-space: pre-wrap;
  line-height: 1.55;

  color: #2c3e50;
}

.cerrar-nota-historial {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #eeeeee;
  color: #333333;
  font-size: 16px;
  cursor: pointer;
}
</style>

<body>

  <h2>NICOLÁS PAJARES</h2>

<main>

  </p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="app.js"></script>


<script type="module">

import {
  getApps,
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyCpCO82XE8I990mWw4Fe8EVwhmUOAeLZdv4",

  authDomain: "inlact.firebaseapp.com",

  projectId: "inlact",

  storageBucket: "inlact.appspot.com",

  messagingSenderId: "143868382036",

  appId: "1:143868382036:web:b5af0e4faced7e880216c1"

};


const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);


const db = getFirestore(app);

const lista =
  document.getElementById("listaVisitas");


/* ===============================
   ESCAPAR HTML
================================ */

function escaparHTML(texto) {

  return String(texto ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ===============================
   OBTENER FECHA
================================ */

function obtenerFecha(item) {

  if (
    item.fecha &&
    typeof item.fecha.toDate === "function"
  ) {
    return item.fecha.toDate();
  }

  if (
    typeof item.fecha === "string" &&
    item.fecha.trim() !== ""
  ) {

    const partes =
      item.fecha.split("-");

    if (partes.length === 3) {

      const año =
        Number(partes[0]);

      const mes =
        Number(partes[1]) - 1;

      const dia =
        Number(partes[2]);

      return new Date(
        año,
        mes,
        dia
      );
    }

    const fecha =
      new Date(item.fecha);

    if (!isNaN(fecha.getTime())) {
      return fecha;
    }
  }

  return null;
}


/* ===============================
   MOSTRAR FECHA
================================ */

function mostrarFecha(fecha) {

  if (!fecha) return "";

  return fecha.toLocaleString(
    "es-AR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* ===============================
   ABRIR NOTA
================================ */

function abrirNotaHistorial(actividad) {

  const overlay =
    document.createElement("div");

  overlay.className =
    "overlay-nota-historial";


  const ventana =
    document.createElement("div");

  ventana.className =
    "ventana-nota-historial";


  ventana.innerHTML = `

    <h3>
      ${escaparHTML(
        actividad.titulo ||
        "Visita"
      )}
    </h3>

    <div class="datos-nota-historial">

      <strong>
        ${escaparHTML(
          actividad.cliente
        )}
      </strong>

      <br>

      ${mostrarFecha(
        actividad.fecha
      )}

    </div>

    <div class="contenido-nota-historial">
      ${escaparHTML(
        actividad.nota || ""
      )}
    </div>

    <button
      class="cerrar-nota-historial"
      type="button"
    >
      Cerrar
    </button>

  `;


  overlay.appendChild(ventana);

  document.body.appendChild(overlay);


  ventana
    .querySelector(
      ".cerrar-nota-historial"
    )
    .onclick = () => {

      overlay.remove();

    };


  overlay.onclick = event => {

    if (event.target === overlay) {

      overlay.remove();

    }

  };

}


/* ===============================
   ÚLTIMAS ACTIVIDADES
================================ */

async function cargarUltimasActividades() {

  lista.innerHTML =
    "<li>Cargando...</li>";


  try {

    const [
      visitasSnap,
      egresosSnap
    ] = await Promise.all([

      getDocs(
        collection(db,"visitas")
      ),

      getDocs(
        collection(db,"egresos")
      )

    ]);


    /* ===============================
       EGRESOS
    ================================ */

    const egresos = [];


    egresosSnap.forEach(docSnap => {

      egresos.push({

        id: docSnap.id,

        ...docSnap.data()

      });

    });


    const egresosPorId =
      new Map();


    egresos.forEach(egreso => {

      egresosPorId.set(
        egreso.id,
        egreso
      );

    });


    /* ===============================
       ACTIVIDADES
    ================================ */

    const actividades = [];

    const ventasAgrupadas =
      new Map();


    visitasSnap.forEach(docSnap => {

      const v =
        docSnap.data();


      /* ===============================
         VENTAS
      ================================ */

      if (
        v.tipoVisita === "Venta"
      ) {

        let ids =
          v.egresoId;


        if (!Array.isArray(ids)) {

          ids =
            ids
              ? [ids]
              : [];

        }


        let productos = [];


        ids.forEach(id => {

          const egreso =
            egresosPorId.get(id);


          if (
            egreso &&
            egreso.tipoEgreso === "venta"
          ) {

            productos.push({

              nombre:
                egreso.productoNombre ||
                "Producto sin nombre",

              cantidad:
                egreso.cantidad,

              unidad:
                egreso.unidad || "",

              lote:
                egreso.lote || ""

            });

          }

        });


        if (
          productos.length === 0 &&
          Array.isArray(v.productos)
        ) {

          productos =
            v.productos.map(p => ({

              nombre:
                p.nombre ||
                "Producto sin nombre",

              cantidad:
                p.cantidad,

              unidad:
                p.unidad || "",

              lote:
                p.lote || ""

            }));

        }


        const fecha =
          obtenerFecha(v);


        const cliente =
          v.clienteNombre ||
          v.cliente ||
          "Cliente sin nombre";


        let clave;


        if (v.ventaId) {

          clave =
            "venta-" +
            v.ventaId;

        } else if (
          Array.isArray(v.egresoId) &&
          v.egresoId.length
        ) {

          clave =
            "egresos-" +
            [...v.egresoId]
              .sort()
              .join("-");

        } else {

          const tiempo =
            fecha
              ? Math.floor(
                  fecha.getTime() / 60000
                )
              : 0;


          clave =
            "cliente-" +
            cliente +
            "-fecha-" +
            tiempo;

        }


        if (
          ventasAgrupadas.has(clave)
        ) {

          const venta =
            ventasAgrupadas.get(
              clave
            );


          productos.forEach(
            producto => {

              venta.productos.push(
                producto
              );

            }
          );


          if (
            fecha &&
            (
              !venta.fecha ||
              fecha > venta.fecha
            )
          ) {

            venta.fecha =
              fecha;

          }

        } else {

          ventasAgrupadas.set(
            clave,
            {

              id:
                docSnap.id,

              origen:
                "venta",

              fecha,

              cliente,

              tipo:
                "Venta",

              productos

            }
          );

        }


        return;

      }


      /* ===============================
         NOTAS / VISITAS / ENSAYOS
      ================================ */

      actividades.push({

        id:
          docSnap.id,

        origen:
          "visita",

        fecha:
          obtenerFecha(v),

        cliente:
          v.cliente ||
          v.clienteNombre ||
          "Cliente sin nombre",

        tipo:
          v.tipoVisita ||
          "Sin tipo",

        titulo:
          v.titulo ||
          "",

        nota:
          v.nota ||
          "",

        productos:
          Array.isArray(v.productos)
            ? v.productos
            : []

      });

    });


    /* ===============================
       AGREGAR VENTAS
    ================================ */

    ventasAgrupadas.forEach(
      venta =>
        actividades.push(venta)
    );


    /* ===============================
       VENTAS NO RELACIONADAS
    ================================ */

    const idsRelacionados =
      new Set();


    visitasSnap.forEach(
      docSnap => {

        const v =
          docSnap.data();


        if (
          v.tipoVisita !== "Venta"
        ) {
          return;
        }


        let ids =
          v.egresoId;


        if (!Array.isArray(ids)) {

          ids =
            ids
              ? [ids]
              : [];

        }


        ids.forEach(id => {

          if (id) {

            idsRelacionados.add(id);

          }

        });

      }
    );


    egresos.forEach(egreso => {

      if (
        egreso.tipoEgreso !== "venta"
      ) {
        return;
      }


      if (
        idsRelacionados.has(
          egreso.id
        )
      ) {
        return;
      }


      actividades.push({

        id:
          egreso.id,

        origen:
          "venta",

        fecha:
          obtenerFecha(egreso),

        cliente:
          egreso.clienteNombre ||
          "Cliente sin nombre",

        tipo:
          "Venta",

        productos: [

          {

            nombre:
              egreso.productoNombre ||
              "Producto sin nombre",

            cantidad:
              egreso.cantidad,

            unidad:
              egreso.unidad || "",

            lote:
              egreso.lote || ""

          }

        ]

      });

    });


    /* ===============================
       ORDENAR
    ================================ */

    actividades.sort(
      (a,b) => {

        const fechaA =
          a.fecha
            ? a.fecha.getTime()
            : 0;


        const fechaB =
          b.fecha
            ? b.fecha.getTime()
            : 0;


        return fechaB - fechaA;

      }
    );


    /* ===============================
       ÚLTIMAS 5
    ================================ */

    const ultimas =
      actividades.slice(0,5);


    lista.innerHTML = "";


    if (
      ultimas.length === 0
    ) {

      lista.innerHTML =
        "<li>No hay actividades registradas.</li>";

      return;

    }


    /* ===============================
       MOSTRAR
    ================================ */

    ultimas.forEach(
      actividad => {

        const li =
          document.createElement("li");


        /* ===============================
           NOTA DE VISITA
        ================================ */

        if (
          actividad.tipo ===
          "Nota de visita"
        ) {

          li.className =
            "item-nota-visita";


          li.innerHTML = `

            <strong>
              ${escaparHTML(
                actividad.cliente
              )}
            </strong>

            <br>

            <small>
              ${mostrarFecha(
                actividad.fecha
              )}
            </small>

            <br>

            <span
              class="tag-visita tag-comercial"
            >
              Visita
            </span>

            <span
              class="titulo-nota-historial"
            >
              ${escaparHTML(
                actividad.titulo ||
                "Visita"
              )}
            </span>

          `;


          li.onclick = () => {

            abrirNotaHistorial(
              actividad
            );

          };


          lista.appendChild(li);

          return;

        }


        /* ===============================
           VENTA
        ================================ */

        if (
          actividad.origen ===
          "venta"
        ) {

          let productosHTML = "";


          if (
            actividad.productos &&
            actividad.productos.length
          ) {

            productosHTML =
              actividad.productos
                .map(
                  producto => `

                    <div
                      class="producto-venta"
                    >

                      <span
                        class="dato-producto"
                      >
                        📦
                        ${escaparHTML(
                          producto.nombre
                        )}
                      </span>

                      <span
                        class="dato-cantidad"
                      >
                        ⚖️
                        ${escaparHTML(
                          producto.cantidad ??
                          ""
                        )}
                        ${escaparHTML(
                          producto.unidad ||
                          ""
                        )}
                      </span>

                      <span
                        class="dato-lote"
                      >
                        🏷️
                        ${escaparHTML(
                          producto.lote ||
                          ""
                        )}
                      </span>

                    </div>

                  `
                )
                .join("");

          }


          li.innerHTML = `

            <strong>
              ${escaparHTML(
                actividad.cliente
              )}
            </strong>

            <br>

            <small>
              ${mostrarFecha(
                actividad.fecha
              )}
            </small>

            <br>

            <span
              class="tag-visita tag-entrega"
            >
              Venta
            </span>

            <div
              class="productos-venta"
            >
              ${productosHTML}
            </div>

          `;


        }


        /* ===============================
           OTRAS ACTIVIDADES
        ================================ */

        else {

          let clase =
            "tag-visita";


          if (
            actividad.tipo ===
            "Visita comercial"
          ) {

            clase +=
              " tag-comercial";

          }

          else if (
            actividad.tipo ===
            "Ensayo"
          ) {

            clase +=
              " tag-ensayo";

          }

          else if (
            actividad.tipo ===
            "Entrega de productos"
          ) {

            clase +=
              " tag-entrega";

          }


          let productosHTML =
            "";


          if (
            actividad.productos &&
            actividad.productos.length
          ) {

            productosHTML =
              actividad.productos
                .map(
                  p => `

                    📦
                    ${escaparHTML(
                      p.nombre
                    )}

                    ${
                      p.cantidad
                        ? `(${escaparHTML(
                            p.cantidad
                          )})`
                        : ""
                    }

                  `
                )
                .join("<br>");

          }


          li.innerHTML = `

            <strong>
              ${escaparHTML(
                actividad.cliente
              )}
            </strong>

            <br>

            <small>
              ${mostrarFecha(
                actividad.fecha
              )}
            </small>

            <br>

            <span
              class="${clase}"
            >
              ${escaparHTML(
                actividad.tipo
              )}
            </span>

            ${
              productosHTML
                ? `
                  <div class="productos">
                    ${productosHTML}
                  </div>
                `
                : ""
            }

          `;

        }


        lista.appendChild(li);

      }
    );


  }

  catch(error) {

    console.error(
      "Error cargando actividades:",
      error
    );


    lista.innerHTML = `

      <li>

        <strong>
          No se pudieron cargar las actividades.
        </strong>

        <br>

        <small>
          Revisá la consola para más información.
        </small>

      </li>

    `;

  }

}


/* ===============================
   CARGAR
================================ */

cargarUltimasActividades();


/* ===============================
   HISTORIAL COMPLETO
================================ */

document
  .getElementById(
    "abrir-historial"
  )
  .onclick = event => {

    event.preventDefault();

    window.open(
      "historial.html",
      "historial",
      "width=420,height=700"
    );

  };

</script>
