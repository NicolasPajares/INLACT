<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>INLACT · Nueva Ubicación</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="nueva-ubicacion.css">

</head>

<body style="visibility: hidden;">


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>


<main>

<section class="card">

<h2>Nueva Ubicación</h2>

<form id="formUbicacion">

<label>

Nombre de la ubicación

<input
type="text"
id="nombre"
required
placeholder="Ej.: Depósito Villa María">

</label>

<button
type="submit"
id="btnGuardar">

Guardar Ubicación

</button>

<button
type="button"
id="btnCancelar">

Cancelar

</button>

</form>

</section>

</main>


<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina().then(async () => {
      await import("./usuario-menu.js");
      await import("./nueva-ubicacion.js");
  });
</script>
</body>
</html>


</body>

</html>
