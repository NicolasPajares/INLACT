<!DOCTYPE html>
<html lang="es">

<head>

    <!-- SEO / Mobile -->
    <meta name="description" content="INLACT - Crear nueva ubicación">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="nueva-ubicacion.css">

    <title>INLACT · Nueva Ubicación</title>

</head>

<body>

<main>

    <section>

        <figure>
            <img src="img/logo.jpg" alt="INLACT">
        </figure>

        <h2>NICOLÁS PAJARES</h2>

        <h1>Crear nueva ubicación</h1>

        <form id="formNuevaUbicacion">

            <label for="nombre">
                Nombre de la ubicación
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ej: Depósito Villa María"
                required
            >

            <div class="acciones-form">

                <button
                    type="submit"
                    class="btn-guardar">
                    💾 Guardar ubicación
                </button>

                <button
                    type="button"
                    class="btn-cancelar"
                    onclick="location.href='ubicaciones.html'">
                    ✖ Cancelar
                </button>

            </div>

        </form>

    </section>

</main>

<footer>

    <p>
        © INLACT ·
        <a href="aviso-legal.html">
            Aviso Legal
        </a>
    </p>

</footer>

<script
    type="module"
    src="nueva-ubicacion.js">
</script>

</body>

</html>
