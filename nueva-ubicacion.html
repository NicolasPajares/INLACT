<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>INLACT · Nueva Ubicación</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="nueva-ubicacion.css">

</head>

<body>

<header>

    <figure>
        <img src="img/logo.jpg" alt="INLACT">
    </figure>

    <h2>NICOLÁS PAJARES</h2>

</header>

<main>

<section class="card">

<h2>Nueva Ubicación</h2>

<form id="formUbicacion">

<label>

Nombre de la ubicación

<input
type="text"
id="nombre"
required
placeholder="Ej.: Depósito Villa María">

</label>

<button
type="submit"
id="btnGuardar">

Guardar Ubicación

</button>

<button
type="button"
id="btnCancelar">

Cancelar

</button>

</form>

</section>

</main>

<script type="module" src="nueva-ubicacion.js"></script>

</body>

</html>
