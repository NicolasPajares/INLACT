<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Nuevo ensayo</title>

    <meta name="description" content="INLACT - Crear nuevo ensayo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS reutilizado de nuevo-cliente -->
    <link rel="stylesheet" href="nuevo-ensayo.css">
</head>

<body>

<header>
    <figure>
        <img src="img/logo.jpg" alt="INLACT">
    </figure>
    <h2>NICOLÁS PAJARES</h2>
</header>

<main>

<section class="card card-formulario">

    <h1>Crear nuevo ensayo</h1>

    <form id="formNuevoEnsayo">

        <!-- CLIENTE -->
        <label>Cliente</label>
        <select id="cliente" required>
            <option value="">Seleccionar cliente</option>
        </select>

        <!-- FECHA -->
        <label>Fecha del ensayo</label>
        <input type="date" id="fecha" required>

        <!-- NOMBRE ENSAYO -->
        <label>Nombre del ensayo</label>
        <input id="nombreEnsayo" placeholder="Ej: Ensayo mozzarella cilindro" required>

        <!-- PROPUESTA -->
        <label>Propuesta</label>
        <textarea
            id="propuesta"
            rows="4"
            placeholder="Objetivo del ensayo, hipótesis, planteo técnico...">
        </textarea>

        <!-- DOSIS -->
        <label>Dosis</label>
        <textarea
            id="dosis"
            rows="3"
            placeholder="Ej: 250 ml / 1000 L de agua">
        </textarea>

        <!-- ELABORACIÓN -->
        <label>Elaboración</label>
        <textarea
            id="elaboracion"
            rows="4"
            placeholder="Descripción del proceso de elaboración">
        </textarea>

        <!-- RESULTADOS -->
        <label>Resultados</label>
        <textarea
            id="resultados"
            rows="4"
            placeholder="Observaciones, mediciones, comportamiento">
        </textarea>

        <!-- CONCLUSIÓN -->
        <label>Conclusión</label>
        <textarea
            id="conclusion"
            rows="4"
            placeholder="Conclusión técnica del ensayo">
        </textarea>

        <!-- PROPUESTA COMERCIAL / LABORAL -->
        <label>Propuesta comercial</label>
        <textarea
            id="propuestaComercial"
            rows="4"
            placeholder="Propuesta comercial, recomendación o próximos pasos">
        </textarea>

        <!-- FOTOS -->
        <label>Fotos del ensayo</label>
        <input type="file" id="fotos" accept="image/*" multiple>

        <!-- ACCIONES -->
        <div class="acciones-form">
            <button type="submit" class="btn-guardar">
                💾 Guardar ensayo
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="location.href='ensayos.html'">
                ✖ Cancelar
            </button>
        </div>

    </form>

</section>

</main>

<footer>
    <p>© INLACT · <a href="aviso-legal.html">Aviso Legal</a></p>
</footer>

<script type="module" src="nuevo-ensayo.js"></script>

</body>
</html>
