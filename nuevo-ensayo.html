<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Nuevo ensayo</title>

    <meta name="description" content="INLACT - Crear nuevo ensayo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="nuevo-ensayo.css">
</head>

<body>

<header>
    <figure>
        <img src="img/logo.jpg" alt="Logo INLACT">
    </figure>
    <h2>NICOLÁS PAJARES</h2>
</header>

<main>

<section class="card card-formulario">

    <h1>Crear nuevo ensayo</h1>

    <form id="formNuevoEnsayo" enctype="multipart/form-data">
<input type="file" id="fotos" multiple accept="image/*">
        <!-- CLIENTE -->
        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente" required>
            <option value="">Seleccionar cliente</option>
        </select>

        <!-- FECHA -->
        <label for="fecha">Fecha del ensayo</label>
        <input type="date" id="fecha" name="fecha" required>

        <!-- NOMBRE ENSAYO -->
        <label for="nombreEnsayo">Nombre del ensayo</label>
        <input
            type="text"
            id="nombreEnsayo"
            name="nombreEnsayo"
            placeholder="Ej: Ensayo mozzarella cilindro"
            required
        >

        <!-- PROPUESTA -->
        <label for="propuesta">Propuesta</label>
        <textarea
            id="propuesta"
            name="propuesta"
            rows="4"
            placeholder="Objetivo del ensayo, hipótesis, planteo técnico..."
        ></textarea>

        <!-- DOSIS -->
        <label for="dosis">Dosis</label>
        <textarea
            id="dosis"
            name="dosis"
            rows="3"
            placeholder="Ej: 250 ml / 1000 L de agua"
        ></textarea>

        <!-- ELABORACIÓN -->
        <label for="elaboracion">Elaboración</label>
        <textarea
            id="elaboracion"
            name="elaboracion"
            rows="4"
            placeholder="Descripción del proceso de elaboración"
        ></textarea>

        <!-- RESULTADOS -->
        <label for="resultados">Resultados</label>
        <textarea
            id="resultados"
            name="resultados"
            rows="4"
            placeholder="Observaciones, mediciones, comportamiento"
        ></textarea>

        <!-- CONCLUSIÓN -->
        <label for="conclusion">Conclusión</label>
        <textarea
            id="conclusion"
            name="conclusion"
            rows="4"
            placeholder="Conclusión técnica del ensayo"
        ></textarea>

        <!-- PROPUESTA COMERCIAL -->
        <label for="propuestaComercial">Propuesta comercial</label>
        <textarea
            id="propuestaComercial"
            name="propuestaComercial"
            rows="4"
            placeholder="Propuesta comercial, recomendación o próximos pasos"
        ></textarea>

        <!-- FOTOS -->
        <label for="fotos">Fotos del ensayo (máx. 10)</label>
        <input
            type="file"
            id="fotos"
            name="fotos"
            accept="image/*"
            multiple
        >

        <!-- ACCIONES -->
        <div class="acciones-form">
            <button type="submit" class="btn-guardar">
                💾 Guardar ensayo
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="location.href='ensayos.html'">
                ✖ Cancelar
            </button>
        </div>

    </form>

</section>

</main>

<footer>
    <p>© INLACT · <a href="aviso-legal.html">Aviso Legal</a></p>
</footer>

<script type="module" src="nuevo-ensayo.js"></script>

</body>
</html>
