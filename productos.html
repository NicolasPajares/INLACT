<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>INLACT · Productos</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Catálogo de productos">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="productos.css">

</head>

<body style="visibility: hidden;">


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>


<main>

    <!-- ===============================
         ACCESOS RÁPIDOS
    ================================ -->

    <section class="quick-actions">

        <a href="clientes.html" class="action-card">
            <img src="img/icon-clientes.svg" alt="">
            <span>Clientes</span>
        </a>

        <a href="stock.html" class="action-card active">
            <img src="img/icon-stock.svg" alt="">
            <span>Stock</span>
        </a>

        <a href="ensayos.html" class="action-card">
            <img src="img/icon-ensayos.svg" alt="">
            <span>Ensayos</span>
        </a>

        <a href="precios.html" class="action-card">
            <img src="img/icon-precios.svg" alt="">
            <span>Precios</span>
        </a>

    </section>

    <!-- ===============================
         NUEVO PRODUCTO
    ================================ -->

    <button id="btnNuevoProducto">

        📦 Nuevo producto

    </button>

    <!-- ===============================
         LISTA
    ================================ -->

    <h2>Productos</h2>

    <input
        type="text"
        id="buscadorProductos"
        placeholder="Buscar por código o descripción..."
    >

    <ul id="listaProductos">

    </ul>

    <!-- ===============================
         VOLVER
    ================================ -->

    <button id="btnVolver">

        ⬅ Volver a Stock

    </button>

</main>


<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina().then(async () => {
      await import("./usuario-menu.js");
      await import("./productos.js");
  });
</script>
</body>
</html>


</body>

</html>
