<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Cotización INLACT</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- CSS GENERAL -->
  <link
    rel="stylesheet"
    href="index.css"
  >

  <!-- CSS COTIZACIÓN -->
  <link
    rel="stylesheet"
    href="cotizacion.css"
  >

</head>


<body>


<!-- =========================================================
     HEADER IGUAL AL INDEX / ENSAYO
========================================================= -->

<header>

  <figure>

    <img
      src="img/logo.jpg"
      alt="INLACT"
    >

  </figure>

  <h2>
    NICOLÁS PAJARES
  </h2>

</header>



<!-- =========================================================
     CONTENEDOR PRINCIPAL
========================================================= -->

<main class="contenedor-cotizacion">


  <!-- =======================================================
       MENÚ IZQUIERDO
  ======================================================== -->

  <aside class="menu-cotizacion">

    <div class="menu-sticky-cotizacion">

      <button
        type="button"
        data-seccion="propuesta"
      >
        Propuesta
      </button>


      <button
        type="button"
        data-seccion="dosis"
      >
        Dosis
      </button>


      <button
        type="button"
        data-seccion="cotizacion"
      >
        Cotización
      </button>


      <button
        type="button"
        data-seccion="observaciones"
      >
        Observaciones
      </button>

    </div>

  </aside>



  <!-- =======================================================
       COLUMNA BLANCA
  ======================================================== -->

  <section class="contenido-blanco-cotizacion">


    <!-- =====================================================
         PORTADA
    ====================================================== -->

    <section
      class="encabezado-cotizacion"
      id="inicio"
    >

      <!--
        Acá el JS colocará solamente
        el nombre de la empresa.
      -->

      <h1 id="empresa"></h1>


      <!--
        Fecha de la cotización.
      -->

      <p id="fecha"></p>


      <!--
        Nombre de la cotización.
      -->

      <h2 id="nombre-cotizacion"></h2>

    </section>



    <!-- =====================================================
         PROPUESTA
    ====================================================== -->

    <section
      id="propuesta"
      class="bloque-cotizacion"
    >

      <h3>
        Propuesta
      </h3>

      <div
        id="contenido-propuesta"
        class="contenido-seccion-cotizacion"
      ></div>

    </section>



    <!-- =====================================================
         DOSIS
    ====================================================== -->

    <section
      id="dosis"
      class="bloque-cotizacion"
    >

      <h3>
        Dosis
      </h3>

      <div
        id="contenido-dosis"
        class="contenido-seccion-cotizacion"
      ></div>

    </section>



    <!-- =====================================================
         COTIZACIÓN
    ====================================================== -->

    <section
      id="cotizacion"
      class="bloque-cotizacion"
    >

      <h3>
        Cotización
      </h3>


      <!--
        Lista de productos.
        El JS la completa desde Firestore.
      -->

      <div
        id="lista-productos-cotizacion"
      ></div>


      <!--
        Total.
        El JS lo completará.
      -->

      <div
        id="total-cotizacion"
      ></div>

    </section>



    <!-- =====================================================
         OBSERVACIONES
    ====================================================== -->

    <section
      id="observaciones"
      class="bloque-cotizacion"
    >

      <h3>
        Observaciones
      </h3>

      <div
        id="contenido-observaciones"
        class="contenido-seccion-cotizacion"
      ></div>

    </section>



    <!-- =====================================================
         LINK PÚBLICO
    ====================================================== -->

  <section class="link-publico-cotizacion">

  <h4>Link para los clientes</h4>

  <input
    type="text"
    id="link-publico-cotizacion"
    readonly
  >

</section>

</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

  <p>
    © INLACT ·
    <a href="aviso-legal.html">
      Aviso Legal
    </a>
  </p>

</footer>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script
  type="module"
  src="cotizacion.js"
></script>


</body>

</html>
