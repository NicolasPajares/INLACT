<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Ensayos</title>

    <meta name="description" content="INLACT - Gestión de ensayos">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">
    <!-- CSS específico -->
    <link rel="stylesheet" href="ensayos.css">
</head>

<body style="visibility: hidden;">


<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>


<main>

<!-- ===============================
     ACCESOS RÁPIDOS
================================ -->
<section class="quick-actions">
    <a href="clientes.html" class="action-card">
        <img src="img/icon-clientes.svg" alt="">
        <span>Clientes</span>
    </a>

    <a href="stock.html" class="action-card">
        <img src="img/icon-stock.svg" alt="">
        <span>Stock</span>
    </a>

    <a href="ensayos.html" class="action-card active">
        <img src="img/icon-ensayos.svg" alt="">
        <span>Ensayos</span>
    </a>

    <a href="precios.html" class="action-card">
        <img src="img/icon-precios.svg" alt="">
        <span>Precios</span>
    </a>
</section>

<!-- ===============================
     GESTIÓN DE ENSAYOS
================================ -->
<section class="card">

    <button id="btnNuevoEnsayo">
        ➕ Crear nuevo ensayo
    </button>

    <h2>Listado de ensayos</h2>

    <input
        type="text"
        id="buscadorEnsayos"
        placeholder="Buscar por cliente o tipo de ensayo..."
    >

    <ul id="listaEnsayos"></ul>

</section>

<!-- ===============================
     VOLVER
================================ -->
<section style="text-align:center; margin-top:20px;">
    <button onclick="window.location.href='index.html'">
        ⬅ Volver al inicio
    </button>
</section>

</main>

<footer>
    <p>© INLACT · <a href="aviso-legal.html">Aviso Legal</a></p>
</footer>


<script type="module">
  import { protegerPagina } from "./proteger.js";

  protegerPagina().then(async () => {
      await import("./usuario-menu.js");
      await import("./ensayos.js");
  });
</script>
</body>
</html>


</body>
</html>
