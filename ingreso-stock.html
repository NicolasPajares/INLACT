<!DOCTYPE html>
<html lang="es">

<head>

    <!-- SEO / Mobile -->
    <meta name="description" content="INLACT - Ingreso de stock">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base -->
    <link rel="stylesheet" href="index.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="ingreso-stock.css">

    <title>INLACT · Ingreso de Stock</title>

</head>

<body>

<header>
    <figure>
        <img src="img/logo.jpg" alt="INLACT">
    </figure>

    <h2>NICOLÁS PAJARES</h2>
</header>
<main>

    <!-- ===============================
 FORMULARIO INGRESO STOCK
================================ -->

<form id="formIngresoStock">

    <h1>Ingreso de stock</h1>


    <!-- ===============================
     PRODUCTO BUSCABLE
    =============================== -->

    <label for="productoBuscador">
        Producto
    </label>

    <input
        type="text"
        id="productoBuscador"
        placeholder="Escribí para buscar un producto..."
        autocomplete="off"
        required
    >

    <div id="listaProductos"></div>

    <!--
        Este campo guarda internamente
        el ID real del producto de Firestore.
    -->

    <input
        type="hidden"
        id="producto"
    >


    <!-- ===============================
     LOTE
    =============================== -->

    <label for="lote">
        Lote
    </label>

    <input
        type="text"
        id="lote"
        placeholder="Ej: L240315"
        required
    >


    <!-- ===============================
     UBICACIÓN
    =============================== -->

    <label for="ubicacion">
        Ubicación
    </label>

    <select id="ubicacion" required>

        <option value="">
            Seleccionar ubicación
        </option>

    </select>


    <!-- ===============================
     CANTIDAD
    =============================== -->

    <label for="cantidad">
        Cantidad
    </label>

    <input
        type="number"
        id="cantidad"
        placeholder="Ej: 50"
        min="0.01"
        step="any"
        required
    >


    <!-- ===============================
     UNIDAD
    =============================== -->

    <label for="unidad">
        Unidad
    </label>

    <select id="unidad" required>

        <option value="">
            Seleccionar unidad
        </option>

        <option value="sobres">
            Sobres
        </option>

        <option value="kg">
            Kg
        </option>

        <option value="unidades">
            Unidades
        </option>

    </select>


    <!-- ===============================
     FECHA
    =============================== -->

    <label for="fecha">
        Fecha de ingreso
    </label>

    <input
        type="date"
        id="fecha"
        required
    >


    <!-- ===============================
     OBSERVACIÓN
    =============================== -->

    <label for="observacion">
        Observación
    </label>

    <textarea
        id="observacion"
        placeholder="Ej: Compra a proveedor"
        rows="4"
    ></textarea>


    <!-- ===============================
     ACCIONES
    =============================== -->

    <div class="acciones-form">

        <button
            type="submit"
            class="btn-guardar">
            💾 Registrar ingreso
        </button>

        <button
            type="button"
            class="btn-cancelar"
            onclick="location.href='stock.html'">
            ✖ Cancelar
        </button>

    </div>


</form>


</section>


<p>
    © INLACT ·
    <a href="aviso-legal.html">
        Aviso Legal
    </a>
</p>
   

        
       


</body>

</html>
```
