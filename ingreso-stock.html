<!-- SEO / Mobile -->
<meta name="description" content="INLACT - Ingreso de stock">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS base -->
<link rel="stylesheet" href="index.css">

<!-- CSS específico -->
<link rel="stylesheet" href="ingreso-stock.css">

<title>INLACT · Ingreso de Stock</title>

<h2>NICOLÁS PAJARES</h2>

<!-- ===============================
 FORMULARIO INGRESO STOCK


================================ -->

    <form id="formIngresoStock">
            <h1>Ingreso de stock</h1>
    
        <label for="producto">
            Producto
        </label>

        <select id="producto" required>
            <option value="">
                Seleccionar producto
            </option>
        </select>


        <label for="lote">
            Lote
        </label>

        <input
            type="text"
            id="lote"
            placeholder="Ej: L240315"
            required
        >


        <label for="ubicacion">
            Ubicación
        </label>

        <select id="ubicacion" required>
            <option value="">
                Seleccionar ubicación
            </option>
        </select>


        <label for="cantidad">
            Cantidad
        </label>

        <input
            type="number"
            id="cantidad"
            placeholder="Ej: 50"
            min="0.01"
            step="any"
            required
        >


        <label for="unidad">
            Unidad
        </label>

        <select id="unidad" required>
            <option value="">
                Seleccionar unidad
            </option>

            <option value="sobres">
                Sobres
            </option>

            <option value="kg">
                Kg
            </option>

            <option value="unidades">
                Unidades
            </option>
        </select>


        <label for="fecha">
            Fecha de ingreso
        </label>

        <input
            type="date"
            id="fecha"
            required
        >


        <label for="observacion">
            Observación
        </label>

        <textarea
            id="observacion"
            placeholder="Ej: Compra a proveedor"
            rows="4"
        ></textarea>


        <div class="acciones-form">

            <button
                type="submit"
                class="btn-guardar">
                💾 Registrar ingreso
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="location.href='stock.html'">
                ✖ Cancelar
            </button>

        </div>

    </form>

</section>
