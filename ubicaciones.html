
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INLACT · Ubicaciones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="ubicaciones.css">
</head>

<body style="visibility: hidden;">

<header class="header-inlact">
    <figure>
        <a href="index.html" aria-label="Volver al inicio">
            <img src="img/logo.jpg" alt="INLACT">
        </a>
    </figure>

    <div class="menu-usuario">
        <button
            type="button"
            id="btnMenuUsuario"
            aria-expanded="false"
            aria-controls="opcionesUsuario"
        >
            <span id="nombreUsuario">NICOLÁS PAJARES</span>
            <span class="flecha-usuario">▾</span>
        </button>

        <div id="opcionesUsuario" class="opciones-usuario" hidden>
            <button type="button" id="btnCerrarSesion">
                ↪ Cerrar sesión
            </button>
        </div>
    </div>
</header>

<main>
    <button id="btnNuevaUbicacion">
        📍 Nueva ubicación
    </button>

    <h2>Ubicaciones</h2>

    <input
        type="text"
        id="buscadorUbicaciones"
        placeholder="Buscar ubicación..."
    >

    <ul id="listaUbicaciones"></ul>

    <button id="btnVolver">
        ← Volver a Stock
    </button>
</main>

<script type="module">
    import {
        protegerPagina,
        obtenerPerfilUsuario
    } from "./proteger.js";

    protegerPagina()
        .then(async () => {
            const perfil = obtenerPerfilUsuario();

            if (perfil?.rol !== "admin") {
                document.body.style.visibility = "hidden";
                window.location.replace("stock.html");
                return;
            }

            await import("./usuario-menu.js");
            await import("./ubicaciones.js");
        })
        .catch((error) => {
            console.error(
                "Error al verificar permisos de Ubicaciones:",
                error
            );
        });
</script>

</body>
</html>
